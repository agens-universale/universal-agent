[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-server"
version = "0.4.0"
description = "GigaCode Universal Agent — ядро + FastAPI-режим и swarm"
requires-python = ">=3.11"
dependencies = [
    "gc-cli==0.4.0",
    "fastapi>=0.115.0",
    # НЕ пинить сверху: mcp==1.26.0 (зависимость ядра) требует uvicorn>=0.31.1.
    # Прежний server_requirements.txt пинил <0.31.0 и был с ним несовместим.
    "uvicorn[standard]>=0.31.1",
    # Нужен swarm'у для memory/cpu enforcement; без него swarm деградирует до
    # disk+timeout. Своего extra у swarm нет: он поднимается только через
    # POST /swarm/run, то есть без сервера бесполезен.
    "psutil>=5.9,<7",
]


# Команды объявляет каждый профиль — см. комментарий в packaging/cli.
[project.scripts]
gc-cli = "cli:main"
gc-ua = "tui_entry:main"
gc-serve = "serve_entry:main"
gc-mcp = "mcp_runtime.cli:main"
gc-mcp-install = "mcp_runtime.install_cli:main"

# Кода в этом каталоге нет — срез общего дерева src/ через force-include.
[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/server.py" = "server.py"
"../../src/server_cleanup_threads.py" = "server_cleanup_threads.py"
"../../src/rest_api" = "rest_api"
"../../src/swarm" = "swarm"
