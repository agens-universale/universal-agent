[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-cli"
version = "0.4.0"
description = "GigaCode Universal Agent — headless-ядро (агентный цикл, тулы, конфиг, безопасность, MCP)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "requests[socks]",
    "trafilatura",
    "readability-lxml",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "httpx-sse>=0.4.0",
    "mcp==1.26.0",
    "chardet>=7.4.3",
]

# Команды объявляет КАЖДЫЙ профиль, а не только мета: `uv tool install`
# экспортирует в PATH скрипты лишь запрошенного дистрибутива, поэтому лист без
# своей секции дал бы установку вообще без команд (проверено). Точки входа
# фронтендов присутствуют всегда и без своего профиля печатают однострочную
# подсказку — охранники в tui_entry.py / serve_entry.py.
[project.scripts]
gc-cli = "cli:main"
gc-ua = "tui_entry:main"
gc-serve = "serve_entry:main"
gc-mcp = "mcp_runtime.cli:main"
gc-mcp-install = "mcp_runtime.install_cli:main"

# Кода в этом каталоге нет — манифест собирает срез общего дерева src/.
# Перечень явный, а не "весь src/ минус лишнее": only-include не принимает пути
# выше корня проекта (ValueError «must be relative»), а единственная директива,
# которая их принимает, — force-include, и она умеет только включать.
[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/agent_executor.py" = "agent_executor.py"
"../../src/app_version.py" = "app_version.py"
"../../src/arg_parser.py" = "arg_parser.py"
"../../src/backends" = "backends"
