[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-tui"
version = "0.4.0"
description = "GigaCode Universal Agent — ядро + Textual-фронтенд"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех трёх колёс обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-cli==0.4.0",
    "textual>=0.55",
    "rich>=13",
    # tui/services/{trace_render,file_view}.py импортируют pygments напрямую;
    # раньше он приезжал транзитивно через rich, то есть установка зависела от
    # чужого графа зависимостей.
    "pygments>=2.13",
]


# Команды объявляет каждый профиль — см. комментарий в packaging/cli.
[project.scripts]
gc-cli = "cli:main"
gc-ua = "tui_entry:main"
gc-serve = "serve_entry:main"
gc-mcp = "mcp_runtime.cli:main"
gc-mcp-install = "mcp_runtime.install_cli:main"

# Кода в этом каталоге нет — манифест собирает срез общего дерева src/.
# force-include — единственная директива hatchling, принимающая пути выше корня
# проекта: only-include/packages падают с ValueError «must be relative».
[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/tui" = "tui"
"../../src/diff_tui" = "diff_tui"
