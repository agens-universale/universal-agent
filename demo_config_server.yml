# Конфиг процесса gc-serve: какие поверхности он поднимает, где они слушают,
# их токены и правки настроек агента поверх config.yml.
#
#   gc-serve                       # поверхности из server.apis
#   gc-serve chat a2a              # перечисленные (поверхности — первыми)
#   gc-serve --server-config ./config_server.yml --config ./config.yml
#
# Каждая поверхность слушает свой адрес — одинаковый при запуске одним
# процессом и раздельно. Одинаковый адрес у нескольких поверхностей — одно
# приложение в одном процессе (webhook и swarm на одном адресе — ошибка:
# у них одинаковые ручки). Неизвестный ключ — отказ старта.

server:
  # host по умолчанию для всех поверхностей; у поверхности может быть свой.
  host: "0.0.0.0"
  # Общий токен (Authorization: Bearer <token>); поверхность может задать свой.
  # Пустой — без проверки, на старте строка в stderr.
  auth_token: null
  # Поверхности gc-serve без аргументов: webhook, chat, a2a, swarm.
  apis: [webhook]
  log_level: "info"
  # Правки logging.* агента.
  logging:
    # при console_trace: false агент не будет печатать пошаговые сообщения в stdout.
    console_trace: false
    save_logs: false

# Правки настроек агента поверх config.yml — для ВСЕХ поверхностей. Ключи —
# пути настроек через точку (agent.max_steps), как в config.yml и в
# `gc-cli config explain`; можно и вложенной секцией (agent: {max_steps: 100}).
# Плоские имена (max_steps) не принимаются — сервер не стартует с подсказкой.
agent_overrides:
  agent.verbose: false
  agent.use_server_subagents: true
  agent.max_steps: 100

webhook:
  port: 8000
  # system по умолчанию, если во входном JSON его нет. Занятые другими
  # поверхностями и интерактивными сессиями (a2a, responses, completions,
  # acp, cli, tui) — 400.
  default_system: "generic"
  # Роль агента вебхука. Абсолютный путь — как есть; относительный ищется
  # сначала рядом с ЭТИМ файлом, потом среди bundled-ассетов (в репозитории
  # packages/core/assets, в колесе site-packages/gc_core/assets). Не нашёлся
  # нигде — WARNING: молча работать без инструкций сервер не будет.
  agent_md_path: "./prompts/demo_server_agent.md"
  # Восстановление после падения: инстанс при старте и раз в interval_seconds
  # продолжает задачи, чей ход прервался (процесс умер, аренды треда больше
  # нет), и доставляет сообщения, которые никто не забрал. Повтор последнего
  # вызова тула прерванного хода возможен.
  recovery:
    enabled: true
    interval_seconds: 30
    lookback_hours: 24
  threads_cleanup:
    # Периодическая чистка истории тредов в фоне процесса. Каталог тредов
    # общий с gc-cli и TUI: сервер, поднятый в каталоге проекта, удалял бы
    # историю интерактивной работы. Включая — соглашаетесь на это осознанно.
    enabled: true
    interval_seconds: 3600
    ttl_days: 7
  # Только вебхук, поверх общих agent_overrides.
  agent_overrides:
    # Builtin tools, запрещённые вебхуку (чтобы не портить файлы библиотеки и
    # не работать с файловой системой веб-приложения).
    agent.stop_tools:
      - fs_write_file
      - fs_apply_file_edits
      - fs_append_file
      - fs_read_file
      - fs_list_files
      - fs_find_files_by_name
      - fs_find_in_files
      - fs_search_and_replace
      - fs_save_base64_file
      - fs_view_image
      - exec_command
      - exec_python
      - download_file
      # - exec_fetch_url
      - turn_ask_human
      #- session_think
      #- session_memory
      # - exec_calculator

chat:
  # Responses и Chat Completions на одном адресе; страница чата — на «/».
  port: 8090
  # Пустой список — CORS выключен. Непустой — только эти origin, методы GET,
  # POST, OPTIONS, заголовок Authorization. Запись "*" из списка выбрасывается.
  cors_origins: []
  # Рабочий каталог нового хода, если в запросе нет абсолютного metadata.cwd.
  # null — каталог процесса. Относительный путь не используется.
  launch_root: null
  # Проза без тула: deny | judge | allow. Дефолт канала — allow.
  text_answer_mode: "allow"
  # Судья на turn_finish: "off" | "on" | "smart" (кавычки обязательны: YAML
  # читает off и on как boolean).
  finish_gate_mode: "off"
  # Напоминания про session_todo. 0 — не напоминать.
  todo_reminder_steps: 0
  # os_backend агента для chat обязан быть local: каталог хода — путь на
  # машине этого процесса. turn_ask_human и turn_intermediate_reply канал
  # снимает сам: вопрос и прогресс — проза ответа.

a2a:
  # Агент как пир A2A: карточка /.well-known/agent-card.json, JSON-RPC /rpc.
  port: 8091
  # Адрес не loopback без auth_token — отказ старта.
  # URL в карточке; нужен, когда a2a слушает 0.0.0.0/:: — пир по адресу
  # сокета не ходит.
  public_url: null
  name: "GigaCode"
  description: "Универсальный агент GigaCode"
  # Корень хода; metadata.cwd пира принимается только внутри него (без
  # launch_root — внутри каталога процесса): это периметр записи агента.
  launch_root: null
  # Push-уведомления задач: адрес задаёт пир, а ходит по нему сервер.
  # Пустой список — push выключен; иначе только эти хосты (и не во
  # внутреннюю сеть).
  push_allowed_hosts: []
  text_answer_mode: "allow"
  finish_gate_mode: "off"
  todo_reminder_steps: 0

swarm:
  # Задача исполняется gc-cli в песочнице bubblewrap (только Linux). Ручки —
  # как у вебхука, на своём порту.
  port: 8092
  # ВСЕ пути этой секции, кроме agentmd_path (он целится в файл ВНУТРИ пакета),
  # — пользовательские: абсолютный берётся как есть,
  # относительный резолвится от каталога ЭТОГО файла, пустой даёт дефолт под
  # XDG-каталогами (gc_paths(): state — для тредов и песочниц, data — для
  # скиллов). Раньше якорем был корень bundled-ассетов; до разбиения на пакеты он
  # совпадал с корнем репозитория, где лежит и config_server.yml, а после
  # переезда ассетов стал указывать в site-packages/gc_core/assets — то есть в
  # чужой пакет, который стирает `uv tool upgrade`.
  # Процессный каталог sworm'а на хосте: meta/completion/stdout/stderr per swarm_id.
  swarm_threads_dir: "swarm_threads"
  sandbox_root_dir: ".swarm_sandboxes"
  # Куда на хосте сохранять агентские .gc/logs из песочницы при финализации
  # (это делает сам swarm-код, lifecycle, а не тест-оркестратор). Пусто → дефолт
  # swarm_threads_dir/<swarm_id>/agent_logs/. Сохраняются даже при timeout/kill.
  #swarm_logs_dir: "/var/lib/gc-cli/swarm/agent_logs"
  max_concurrent: 10
  ttl_seconds: 86400
  limits:
    memory_mb: 1024
    disk_mb: 2048
    cpu_percent: 50
    timeout_seconds: 1800
  cli_command: "gc-cli"
  # Обёртка песочницы уехала из scripts/ внутрь пакета и едет в колесе как
  # package data. Пусто → она и берётся, что и нужно из коробки. Относительный
  # путь ищется рядом с ЭТИМ файлом, затем в каталоге gc_server/swarm/; не
  # нашёлся нигде — WARNING и та же пакетная обёртка. Прежнее штатное значение
  # develop, "scripts/run-cli-in-sandbox.sh", в установленном профиле не
  # существует нигде, и без фолбэка каждый POST /swarm/run падал бы 500.
  #wrapper_path: "/opt/gc-cli/.venv/lib/python3.12/site-packages/gc_server/swarm/run-cli-in-sandbox.sh"
  sandbox_tool: "bubblewrap"
  # agentmd_path — файл из колеса: относительный путь резолвится от корня
  # bundled-ассетов (packages/core/assets в репозитории,
  # site-packages/gc_core/assets в установке), а не от этого файла.
  agentmd_path: "./prompts/server_agent.md"
  # А вот скиллы — пользовательский контент. "./swarm_skills" здесь означает
  # каталог РЯДОМ с config_server.yml; пусто → дефолт
  # <gc_paths.data>/swarm_skills. Если каталога нет, runner скажет об этом
  # предупреждением и поднимет песочницу без скиллов — молчаливым промах больше
  # не бывает.
  skills_dir: "./swarm_skills"
  # Bind-mount пути для wrapper.sh (AR-6 / AR-7). ТОЛЬКО абсолютные пути —
  # относительные/пустые молча игнорируются (см. swarm/config.py::_abs_or_empty),
  # и тогда wrapper делает fallback на PATH lookup. Полная дока — docs/swarm.md.
  # ВАЖНО для установки через `uv tool install gc-server`: gc-cli приезжает
  # зависимостью и лежит в <UV_TOOL_DIR>/gc-server/bin, но в PATH uv выносит
  # только команды самого дистрибутива (gc-serve). PATH-fallback в такой
  # установке команду не найдёт — задавайте cli_venv_root равным
  # <UV_TOOL_DIR>/gc-server. Обёртка теперь говорит об этом прямо, а не отдаёт
  # голый exit 127.
  # cli_venv_root: "/opt/gc-cli/.venv"      # ro-bind venv c gc-cli внутрь песочницы
  # agent_dep_dir: "/opt/gc-cli/mcp-deps"   # зависимости MCP (node/npx и т.п.)
  # extra_mounts:                           # доп. ro-bind (prompts, skills, статика)
  #   - "/opt/gc-cli/prompts"
  #   - "/opt/gc-cli/skills"
