server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

defaults:
  # Идентификатор системы по умолчанию, если во входном JSON нет поля system.
  system: "generic"

agent:
  # Относительный путь до файла с универсальными инструкциями агента.
  server_agentmd_path: "./server_agent.md"

agent_overrides:
  # Управление консольным трейсом:
  # при console_trace: false агент не будет печатать пошаговые сообщения в stdout.
  console_trace: false
  # Список simple-tools, запрещённых в серверном режиме (чтобы не портить файлы библиотеки).
  stop_tools:
    # Отключаем тулы, которые могут повредить файлы библиотеки и работают с файловой системой веб приложения
    - write_to_file
    - append_to_file
    - read_file
    - list_files
    - search_files
    - search_and_replace
    - execute_command
    # Отключаем интерактив в консоли
    # - answer_question (deprecated tool, removed from registry)
    # Отключаем тулы, которые есть на сервере в режиме server_subagents
    # - update_plan (deprecated tool, replaced by thread_notes)
    - think
    - calculator
  verbose: false
  dump_storage: false
  save_logs: false
  max_steps: 100

swarm:
  enabled: false
  threads_dir: "swarm_threads"
  sandbox_root_dir: ".swarm_sandboxes"
  max_concurrent: 10
  ttl_seconds: 86400
  limits:
    memory_mb: 1024
    disk_mb: 2048
    cpu_percent: 50
    timeout_seconds: 1800
  cli_command: "gc-cli"
  wrapper_path: "scripts/run-cli-in-sandbox.sh"
  sandbox_tool: "bubblewrap"
  agentmd_path: "./swarm_agent.md"
  skills_dir: "./swarm_skills"

