server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  # Сколько секунд вебхук ждёт, пока контекст его задачи строит другой запрос;
  # по истечении — 503, повторите запрос. Сама сборка не прерывается.
  context_build_wait_seconds: 120

defaults:
  # Идентификатор системы по умолчанию, если во входном JSON нет поля system.
  system: "generic"

agent:
  # Абсолютный путь — как есть; относительный ищется сначала рядом с ЭТИМ файлом,
  # потом среди bundled-ассетов (в репозитории packages/core/assets, в колесе
  # site-packages/gc_core/assets). Поэтому "./prompts/..." попадает в bundled-промпт,
  # а "./server_agent.md" — в файл, лежащий рядом с конфигом, как и ожидает человек.
  # Не нашёлся нигде — WARNING: молча работать без инструкций сервер не будет.
  server_agentmd_path: "./prompts/demo_server_agent.md"

logging:
  # при console_trace: false агент не будет печатать пошаговые сообщения в stdout.
  console_trace: false
  save_logs: false

agent_overrides:
  # Ключи — пути настроек через точку (agent.max_steps), как в config.yml и в
  # `gc-cli config explain`; можно и вложенной секцией (agent: {max_steps: 100}).
  # Плоские имена (max_steps) не принимаются — сервер не стартует с подсказкой пути.
  # Builtin tools, запрещённые в серверном режиме (чтобы не портить файлы библиотеки).
  agent.stop_tools:
    # Отключаем тулы, которые могут повредить файлы библиотеки и работают с файловой системой веб приложения
    - fs_write_file
    - fs_apply_file_edits
    - fs_append_file
    - fs_read_file
    - fs_list_files
    - fs_find_files_by_name
    - fs_find_in_files
    - fs_search_and_replace
    - fs_save_base64_file
    - fs_view_image
    - exec_command
    - exec_python
    - download_file
    # - exec_fetch_url
    - turn_ask_human
    #- session_think
    #- session_memory
    # - exec_calculator
    # Отключаем интерактив в консоли
  agent.verbose: false
  agent.use_server_subagents: true
  agent.max_steps: 100

threads_cleanup:
  # Периодическая чистка файлов истории тредов (meta_*.json / data_*.jsonl).
  # Запускается в фоне внутри процесса REST-сервера.
  #
  # БЕЗ ЭТОЙ СЕКЦИИ ЧИСТКА ВЫКЛЮЧЕНА. Дефолт выключенный потому, что каталог
  # тредов общий с gc-cli и TUI: сервер, поднятый в каталоге проекта, удалял бы
  # историю интерактивной работы. Включая — соглашаетесь на это осознанно.
  enabled: true
  interval_seconds: 3600
  ttl_days: 7

swarm:
  enabled: false
  # ВСЕ пути этой секции, кроме agentmd_path (он целится в файл ВНУТРИ пакета),
  # — пользовательские: абсолютный берётся как есть,
  # относительный резолвится от каталога ЭТОГО файла, пустой даёт дефолт под
  # XDG-каталогами (gc_paths(): state — для тредов и песочниц, data — для
  # скиллов). Раньше якорем был корень bundled-ассетов; до разбиения на пакеты он
  # совпадал с корнем репозитория, где лежит и config_server.yml, а после
  # переезда ассетов стал указывать в site-packages/gc_core/assets — то есть в
  # чужой пакет, который стирает `uv tool upgrade`.
  # Процессный каталог sworm'а на хосте: meta/completion/stdout/stderr per swarm_id.
  swarm_threads_dir: "swarm_threads"
  sandbox_root_dir: ".swarm_sandboxes"
  # Куда на хосте сохранять агентские .gc/logs из песочницы при финализации
  # (это делает сам swarm-код, lifecycle, а не тест-оркестратор). Пусто → дефолт
  # swarm_threads_dir/<swarm_id>/agent_logs/. Сохраняются даже при timeout/kill.
  #swarm_logs_dir: "/var/lib/gc-cli/swarm/agent_logs"
  max_concurrent: 10
  ttl_seconds: 86400
  limits:
    memory_mb: 1024
    disk_mb: 2048
    cpu_percent: 50
    timeout_seconds: 1800
  cli_command: "gc-cli"
  # Обёртка песочницы уехала из scripts/ внутрь пакета и едет в колесе как
  # package data. Пусто → она и берётся, что и нужно из коробки. Относительный
  # путь ищется рядом с ЭТИМ файлом, затем в каталоге gc_server/swarm/; не
  # нашёлся нигде — WARNING и та же пакетная обёртка. Прежнее штатное значение
  # develop, "scripts/run-cli-in-sandbox.sh", в установленном профиле не
  # существует нигде, и без фолбэка каждый POST /swarm/run падал бы 500.
  #wrapper_path: "/opt/gc-cli/.venv/lib/python3.12/site-packages/gc_server/swarm/run-cli-in-sandbox.sh"
  sandbox_tool: "bubblewrap"
  # agentmd_path — файл из колеса: относительный путь резолвится от корня
  # bundled-ассетов (packages/core/assets в репозитории,
  # site-packages/gc_core/assets в установке), а не от этого файла.
  agentmd_path: "./prompts/server_agent.md"
  # А вот скиллы — пользовательский контент. "./swarm_skills" здесь означает
  # каталог РЯДОМ с config_server.yml; пусто → дефолт
  # <gc_paths.data>/swarm_skills. Если каталога нет, runner скажет об этом
  # предупреждением и поднимет песочницу без скиллов — молчаливым промах больше
  # не бывает.
  skills_dir: "./swarm_skills"
  # Bind-mount пути для wrapper.sh (AR-6 / AR-7). ТОЛЬКО абсолютные пути —
  # относительные/пустые молча игнорируются (см. swarm/config.py::_abs_or_empty),
  # и тогда wrapper делает fallback на PATH lookup. Полная дока — docs/swarm.md.
  # ВАЖНО для установки через `uv tool install gc-server`: gc-cli приезжает
  # зависимостью и лежит в <UV_TOOL_DIR>/gc-server/bin, но в PATH uv выносит
  # только команды самого дистрибутива (gc-serve). PATH-fallback в такой
  # установке команду не найдёт — задавайте cli_venv_root равным
  # <UV_TOOL_DIR>/gc-server. Обёртка теперь говорит об этом прямо, а не отдаёт
  # голый exit 127.
  # cli_venv_root: "/opt/gc-cli/.venv"      # ro-bind venv c gc-cli внутрь песочницы
  # agent_dep_dir: "/opt/gc-cli/mcp-deps"   # зависимости MCP (node/npx и т.п.)
  # extra_mounts:                           # доп. ro-bind (prompts, skills, статика)
  #   - "/opt/gc-cli/prompts"
  #   - "/opt/gc-cli/skills"
