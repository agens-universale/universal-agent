# Скопируй этот блок в секцию mcp-servers: своего config.yml агента.
# Работает с persistent_session: true — один процесс npx и один Chromium
# живут весь цикл работы агента (см. src/tools/connect_mcp/persistent_stdio.py).
#
# `command:` — путь до npx после `python recommended_mcp/install.py`
# (install печатает готовый путь в конце). Node лежит в gc_paths()['data']:
#   Linux/macOS: ~/.local/share/gc/node/v18.0.0/bin/npx
#   Windows:     ~/.gc/node/v18.0.0/bin/npx
# `--output-dir` — gc_paths()['cache']/playwright-mcp (см. readme).
browser_playwright:
  transport: stream_stdio
  command: ~/.local/share/gc/node/v18.0.0/bin/npx
  args: ["-y", "@playwright/mcp@0.0.70", "--output-dir", "~/.cache/gc/playwright-mcp"]
  persistent_session: true
  description: Browser automation via Playwright. Use for web navigation, clicking, form filling, taking screenshots, and webscraping.
  server-name: playwright-browser

