# recommended_mcp/config.yml
# Манифест доступных MCP-интеграций для background-agent.
# Чтобы пропустить MCP — закомментируй его блок.
# install.py и run.py читают этот файл.
# Куда install.py разворачивает изолированную Node.js (для type: npx).
# По умолчанию — gc_paths()['data']: Linux ~/.local/share/gc, Windows ~/.gc.
# Переопределение (опционально): agent_dep_dir: /custom/path
# Репо для установки source-MCP из git в method-2 (без клона):
#   pip install "git+<repo_url>[@repo_ref]#subdirectory=external/<name>"
# Публичный https → ставится анонимно, в т.ч. через корп-прокси.
repo_url: https://gitverse.ru/gigacode-ai/universal-agent
# repo_ref:   # опц. пин ветки/тега; пусто = дефолтная ветка
mcps:
  - name: computer
    description: управление ПК — скриншоты, клики, ввод
    path: ./computer
    install:
      type: source
      source: ../external/computer-mcp
      dist: computer-mcp
      version: "0.1.0"      # синк с external/*/pyproject.toml (стережёт тест)
      platforms: [win32]
    # run-блок отсутствует: MCP спавнится агентом через stdio.

  - name: office
    description: чтение/запись Word · Excel · PDF · PowerPoint…
    path: ./office
    install:
      type: source
      source: ../external/office-mcp
      dist: office-mcp
      version: "0.3.1"      # синк с external/*/pyproject.toml (стережёт тест)

  - name: science
    description: научные данные и вычисления
    path: ./science
    install:
      type: source
      source: ../external/science-mcp
      dist: science-mcp
      version: "0.1.0"      # синк с external/*/pyproject.toml (стережёт тест)
    run:
      type: command
      command: science-mcp
      args: ["--transport", "http"]

  - name: duckduckgo_search
    description: веб-поиск в интернете
    path: ./duckduckgo_search
    install:
      type: source
      source: ../external/ddgs-mcp
      dist: ddgs-mcp
      version: "0.2.0"      # синк с external/*/pyproject.toml (стережёт тест)
    # run-блок отсутствует: агент спавнит ddgs-mcp по stdio.

  - name: browser_playwright
    description: автоматизация браузера
    path: ./browser_playwright
    optional: true
    install:
      type: npx
      npm_package: "@playwright/mcp"
      commands:
        # Прогреваем npm-кэш (иначе первый запуск агента тянет пакет по сети).
        - [npm, "install", "-g", "@playwright/mcp@0.0.70"]
        # Предварительно качаем chromium — иначе скачается на первом tool_call.
        # Флаг -y нужен чтобы npx не блокировался на «Ok to proceed?» при
        # установке npm-пакета playwright (без него full-auto установка
        # на свежей Windows зависает в ожидании ввода).
        - [npx, "-y", "playwright", "install", "--with-deps", "chromium"]
    # run-блок отсутствует: агент спавнит сервер через stdio on-demand,
    # с persistent_session: true процесс/браузер живут весь цикл агента.
    # для докера использовать
    # install:
    #   type: docker
    # run:
    #   type: docker-compose
    #   detach: true
