# Скопируй этот блок в секцию mcp-servers: твоего config.yml агента.
# Предполагает, что контейнер поднят через recommended_mcp/run.py (порт 127.0.0.1:8080).
# См. README.md в этой папке — про ограничения видимости файлов и stdio-альтернативу.
office-reader:
  transport: stream_http
  url: http://127.0.0.1:8080/mcp
  description: Read office documents (pdf, doc, docx, xls, xlsx, pptx, csv, html, msg) as markdown
  server-name: office-reader
