[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ua"

version = "0.4.0"
description = "GigaCode Universal Agent — полный агент (ядро + CLI + TUI + server)"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.4.0",
    "gc-cli==0.4.0",
    "gc-tui==0.4.0",
    "gc-server==0.4.0",
    "gc-mcp==0.4.0",
    "gc-acp==0.4.0",
]

[project.optional-dependencies]
temporal = ["gc-core-temporalio==0.4.0"]

all = []

[project.scripts]
gc-cli = "gc_cli.cli:main"
gc-ua = "gc_tui:main"
gc-serve = "gc_server.server:serve"
gc-mcp = "recommended_mcp.runtime.cli:main"
gc-mcp-install = "recommended_mcp.runtime.install_cli:main"
gc-voice = "gc_tui.voice_runtime.cli:main"
gc-acp = "gc_acp.main:main"
gc-chat = "gc_server.chat.main:main"
gc-a2a = "gc_server.a2a.main:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    "pytest-rerunfailures>=16.4",
    { include-group = "test" },

    { include-group = "lint" },
]
lint = [
    "complexipy>=4",
    "ruff>=0.14",

    "pre-commit>=4",
    "pre-commit-hooks>=5",

    "pylint>=3.3",

    "vulture>=2.14",
]
test = [

    "gc-testkit",
    "gc-core-temporalio==0.4.0",
    "gc-stores[all]",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "office-mcp",
    "harbor>=0.16; python_version >= '3.12'",

    "textual>=0.55",
    "rich>=13",

    # Версия 1.1.0 требует syrupy==4.8.0, а тот — pytest<9.
    # С нашим pytest>=9.0.3 uv не разрешит зависимости: границу <1.1 не снимать
    # без проверки совместимости. Версия 1.0.0 совместима с syrupy 6 / pytest 9.
    "pytest-textual-snapshot>=1.0,<1.1",
    "pygments>=2.13",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]

gc-core = { workspace = true }
gc-cli = { workspace = true }
gc-tui = { workspace = true }
gc-server = { workspace = true }
gc-mcp = { workspace = true }
gc-acp = { workspace = true }

gc-testkit = { workspace = true }
gc-core-temporalio = { workspace = true }
gc-stores = { workspace = true }
office-mcp = { path = "packages/mcp/external/vendor/office-mcp", editable = true }

[tool.pytest.ini_options]

testpaths = [
    "tests",
    "external/litellm/tests",
    "packages/mcp/tests",
    "packages/core/tests",
    "packages/cli/tests",
    "packages/server/tests",
    "packages/tui/tests",
    "packages/temporalio/tests",
    "packages/acp/tests",
    "packages/stores/tests",
]
asyncio_mode = "auto"

filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = ["external", ".venv", "packages/*/external"]

[tool.ruff.format]

docstring-code-format = false

[tool.ruff.lint]

exclude = ["**/tests/**", "tests/**", "**/conftest.py"]
select = [
    "F", "E", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "PLE", "PLW",
    "T10",

    "ARG001", "ARG004",
    "A001",
    "TRY002",
    "ERA001",
    "N815",
    "S501", "S323",
    "PLR0913",
    "PLR1714", "PLR5501",
]
ignore = [

    "E501",

    "RUF001", "RUF002", "RUF003",

    "UP006", "UP007", "UP035", "UP045",

    "B008",

    "B905",

    "B904",

    "SIM105", "SIM108",

    "SIM117",

    "C408", "RUF005", "RUF012", "RUF015", "RUF059",

    "PLW0108", "PLW0603", "PLW1510", "PLW2901",

    "E402", "E731", "E741",
]

[tool.ruff.lint.per-file-ignores]

"scripts/dead_code_whitelist.py" = ["F821", "B018"]

[tool.ruff.lint.pylint]

max-args = 13

[tool.complexipy]

paths = [
    "packages/cli/src",
    "packages/core/src",
    "packages/mcp/src",
    "packages/server/src",
    "packages/temporalio/src",
    "packages/acp/src",
    "packages/stores/src",
    "packages/core/assets/skills",
    "scripts",
    "integrations",
]
max-complexity-allowed = 15

exclude = [
    "**/gc_tui/**",
    "**/gc_testkit/**",
    "**/tests/**",
    "tests/**",
    "**/conftest.py",
    "external/**",
    "**/external/**",
]

[tool.pylint.main]
ignore-paths = [
    ".*/tests/.*",
    "^tests/.*",
    ".*/conftest\\.py$",
    "^external/.*",
    ".*/external/.*",
    # ВРЕМЕННО: chat и a2a до переезда в gc-server на дублирование не
    # проверялись; долг (completions/responses chat, main обоих) снимается
    # следующим коммитом — план сервера, задачи 1.1b и 1.4.
    ".*/gc_server/chat/.*",
    ".*/gc_server/a2a/.*",
]

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
