[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-cli-pub"
version = "0.0.1"
description = "CLI cient for agent test purposes. Work with v1/responses api"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "requests[socks]",
    "trafilatura",
    "readability-lxml",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "httpx-sse>=0.4.0",
    "mcp==1.26.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "textual>=0.55",
    "rich>=13",
]

[project.scripts]
gc-cli = "cli:main"
gc-ua = "tui:main"
gc-mcp-install = "mcp_runtime.install_cli:main"

[project.optional-dependencies]
dev-tui = [
    "textual>=0.85",
    "rich>=13",
    "pytest-textual-snapshot>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    { include-group = "test" },
]
test = [
    "office-mcp",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
office-mcp = { path = "external/office-mcp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
