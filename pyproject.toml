[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ua"
# Версии ВСЕХ манифестов обязаны совпадать: профили пинят друг друга точно.
# 0.3.0 — разбиение на настоящие пакеты gc_core / gc_cli / gc_tui / gc_server.
version = "0.3.1"
description = "GigaCode Universal Agent — полный агент (ядро + CLI + TUI + server)"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.3.1",
    "gc-cli==0.3.1",
    "gc-tui==0.3.1",
    "gc-server==0.3.1",
    "gc-mcp==0.3.1",
]

[project.optional-dependencies]
# Синоним полной установки. Extras умеют только добавлять, а база здесь уже
# полная — профилей «поменьше» через extras не существует, их роль выполняют
# отдельные дистрибутивы (см. docs/packaging.md).
all = []

[project.scripts]
gc-cli = "gc_cli.cli:main"
gc-ua = "gc_tui:main"
gc-serve = "gc_server.server:serve"
gc-mcp = "recommended_mcp.runtime.cli:main"
gc-mcp-install = "recommended_mcp.runtime.install_cli:main"
gc-voice = "gc_tui.voice_runtime.cli:main"

# Мета — чисто метаданные: ни одного файла, только зависимости и точки входа.
# Раньше здесь жил meta/gc_ua_launcher.py, каждая функция которого делала
# `from X import main; return main()`. Он появился, когда цели точек входа были
# в разных местах и hatchling (без bypass-selection) не собирал пустое колесо;
# после того как цели стали прямыми, посредник осиротел.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    "pytest-rerunfailures>=16.4",
    { include-group = "test" },
    # Инструменты гейта качества едут с обычным `uv sync`: хуки pre-commit и
    # scripts/lint.sh зовут их из этого окружения. Сам хук ставится отдельно —
    # `uv run pre-commit install`, один раз на клон (см. CONTRIBUTING.md).
    { include-group = "lint" },
]
lint = [
    "complexipy>=4",
    "ruff>=0.14",
    # Хуки качества (.pre-commit-config.yaml). Оба — здесь, а не в самом
    # pre-commit: все хуки репозитория объявлены `repo: local` +
    # `language: system`, то есть исполняются из ЭТОГО окружения, а не
    # скачиваются с GitHub (в корпоративной сети он бывает закрыт).
    "pre-commit>=4",
    "pre-commit-hooks>=5",
    # Только ради одной проверки — дублирования кода (duplicate-code, аналог
    # CPD/Duplications у Sonar). Остальные правила pylint выключены: их роль
    # играет ruff. Настройки — [tool.pylint.*] ниже.
    "pylint>=3.3",
    # Мёртвый код (scripts/dead_code_check.py) — аналог S1144/S1763 у Sonar.
    "vulture>=2.14",
]
test = [
    # Раньше жили в runtime-dependencies и приезжали каждому пользователю.
    "gc-testkit",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "office-mcp",
    "harbor>=0.16; python_version >= '3.12'",
    # Тестовый набор гоняет и TUI, и server, и swarm — но сторонние пакеты
    # перечислены НАПРЯМУЮ, а НЕ через "gc-ua[tui,server]". Иначе uv поставил бы
    # соседей editable, скопировав tui/ и server.py в site-packages, а
    # site-packages идёт в sys.path раньше пути на <repo>/src — и dev-цикл начал
    # бы молча исполнять устаревшую копию.
    "textual>=0.55",
    "rich>=13",
    # Снапшот-эталоны TUI: packages/tui/tests/test_snapshot_*.py — 16 тестовых
    # функций и столько же .raw под гитом. Плагин снёс 502213be (17.08.2026)
    # вместе с секцией [project.optional-dependencies] dev-tui, когда корень
    # переписывали в мета-пакет; с тех пор все 16 молча пропускались через
    # importorskip("pytest_textual_snapshot"), а .gitignore продолжал держать
    # правило для их SVG — гейт был зелёным и пустым.
    # Верхняя граница жёсткая, не «на всякий случай»: 1.1.0 пинит syrupy==4.8.0,
    # тот требует pytest>=7,<9, и с нашим pytest>=9.0.3 uv отвечает «No solution
    # found». На 1.0.0 приезжает syrupy 6.0.0, конфликта нет (проверено
    # `uv pip install --dry-run` 28.08.2026).
    "pytest-textual-snapshot>=1.0,<1.1",
    "pygments>=2.13",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# uv читает эти sources и у git-зависимости, поэтому профили приезжают из ТОГО
# ЖЕ коммита и по ТОМУ ЖЕ URL, который набрал пользователь.
gc-core = { workspace = true }
gc-cli = { workspace = true }
gc-tui = { workspace = true }
gc-server = { workspace = true }
gc-mcp = { workspace = true }
# Только для разработки: общая тестовая инфраструктура наборов. Ни в один
# дистрибутив не входит и в колёса не попадает. Комментарий стоял строкой
# выше и по виду относился к gc-mcp — а тот как раз настоящий поставляемый
# дистрибутив со своими командами.
gc-testkit = { workspace = true }
office-mcp = { path = "packages/mcp/external/vendor/office-mcp", editable = true }

[tool.pytest.ini_options]
# Наборы живут при своих пакетах; в корне остаётся только то, что проверяет
# репозиторий целиком (раскладка колёс, recommended_mcp).
testpaths = [
    "tests",
    "external/litellm/tests",
    "packages/mcp/tests",
    "packages/core/tests",
    "packages/cli/tests",
    "packages/server/tests",
    "packages/tui/tests",
]
asyncio_mode = "auto"

# Забытый `await` — ошибка, а не предупреждение. Нужны ОБА фильтра: один ловит
# корутину, освобождённую сборщиком мусора после теста, другой — по счётчику
# ссылок внутри теста. Обоснование и замер — в `packages/core/pyproject.toml`.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
]

# --- Локальный аналог правил Sonar (см. docs/code-quality.md) ----------------
# ruff закрывает «мелкие» правила из отчёта Sonar и держит формат; порог
# cognitive complexity (S3776) считает complexipy тем же алгоритмом, что и
# Sonar; дубли литералов, лишние классы в except, сложность регулярок и
# таблицы без описания — scripts/sonar_like_check.py. Область — ВЕСЬ
# репозиторий, кроме вендорного кода.
[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = ["external", ".venv", "packages/*/external"]

[tool.ruff.format]
# Совместим с Black. Кавычки двойные, отступы пробелами — умолчания ruff.
docstring-code-format = false

[tool.ruff.lint]
# Наборы линтер НЕ проверяет: у тестов свой жанр (фикстуры «не используются»,
# импорт ради побочного эффекта, голые assert'ы), и автофикс там опаснее, чем
# полезен — он уже успел съесть `from gc_server import server` внутри
# `pytest.raises(SystemExit)`, где импорт и был предметом проверки. Формат
# (`ruff format`) по тестам по-прежнему идёт: единый стиль нужен и им.
exclude = ["**/tests/**", "tests/**", "**/conftest.py"]
select = [
    "F", "E", "W",   # pyflakes + pycodestyle
    "I",             # порядок импортов (заменяет isort)
    "UP",            # модернизация синтаксиса
    "B",             # bugbear (в т.ч. B014 -> Sonar S1044)
    "SIM",           # упрощения (в т.ч. SIM102 -> S1066)
    "C4",            # comprehensions
    "PIE",           # (в т.ч. PIE790 -> S2772/S1116)
    "RUF",
    "PLE", "PLW",    # pylint: ошибки и предупреждения
    "T10",           # забытый breakpoint()/pdb
    # --- точечная карта правил Sonar ---
    "ARG001", "ARG004",  # S1172: неиспользуемые параметры функций
    "A001",              # S5806: имя затеняет builtin
    "TRY002",            # S112: raise Exception(...) вместо своего класса
    "ERA001",            # S125: закомментированный код
    "N815",              # S116: поле в стиле mixedCase
    "S501", "S323",      # S4830/S5527: выключенная проверка TLS
    "PLR0913",           # S107: слишком много параметров (порог ниже)
    "PLR1714", "PLR5501",
]
ignore = [
    # Длину строк держит форматтер, дублировать её линтером незачем.
    "E501",
    # Кириллица в строках, докстроках и комментариях — язык проекта.
    # Без этих трёх ruff выдаёт ~27 тысяч ложных срабатываний.
    "RUF001", "RUF002", "RUF003",
    # Модернизация аннотаций typing.* — ~4 тысячи правок без пользы для
    # качества и с риском задеть рантайм-интроспекцию. Отдельная задача.
    "UP006", "UP007", "UP035", "UP045",
    # FastAPI: Depends(...) в значении по умолчанию — штатный приём.
    "B008",
    # zip(strict=) меняет поведение на разной длине — не механическая правка.
    "B905",
    # raise ... from ... — отдельная задача, правок много и все осмысленные.
    "B904",
    # SIM105 (contextlib.suppress) прячет намерение; SIM108 требует тернарник
    # там, где он превращается во вложенный — прямой конфликт с Sonar S3358.
    "SIM105", "SIM108",
    # Вложенные with по строкам читаются лучше, чем один длинный.
    "SIM117",
    # Стиль конструкторов коллекций и литералов — вкусовое, правок много.
    "C408", "RUF005", "RUF012", "RUF015", "RUF059",
    # PLW0108 (лямбда-обёртка) нужна для поздней привязки; PLW0603 (global)
    # осознан в кэшах модулей; PLW1510 (subprocess check=) меняет поведение;
    # PLW2901 (перезапись переменной цикла) — рабочий приём нормализации.
    "PLW0108", "PLW0603", "PLW1510", "PLW2901",
    # E402 — импорты после sys.path-бутстрапа; E731/E741 — вкусовое.
    "E402", "E731", "E741",
]
# ARG002/ARG003 выключены осознанно: методы и classmethod-ы реализуют
# интерфейсы (prompt_description(cls, config_dict), хуки тулов), и «лишний»
# параметр там — часть контракта, а не забытый аргумент.
# PLC0415 (импорт не на верхнем уровне) не включён: ленивые импорты здесь
# осознаны и их ~7 тысяч. S101 (assert) и PLR2004 (магические числа) — шум.

[tool.ruff.lint.per-file-ignores]
# Белый список vulture (scripts/dead_code_check.py): голые имена там — пометки
# «используется», файл никто не исполняет и не импортирует.
"scripts/dead_code_whitelist.py" = ["F821", "B018"]

[tool.ruff.lint.pylint]
# S107 у Sonar: больше 13 параметров. Для существующего кода — won't fix
# построчным `# noqa: PLR0913`, новые функции правило ловит.
max-args = 13

[tool.complexipy]
# S3776. Область — прод-код всех пакетов: ровно то, что видит sonar.sources.
paths = [
    "packages/cli/src",
    "packages/core/src",
    "packages/mcp/src",
    "packages/server/src",
    "packages/testkit/src",
    "packages/tui/src",
    "packages/core/assets/skills",
    "scripts",
    "integrations",
]
max-complexity-allowed = 15
# Тесты исключены как в sonar.exclusions; external — вендорное.
exclude = [
    "**/tests/**",
    "tests/**",
    "**/conftest.py",
    "external/**",
    "**/external/**",
]

# --- Дублирование кода (аналог Sonar Duplications / CPD) ---------------------
# pylint здесь — только детектор копипасты: `pylint --disable=all
# --enable=duplicate-code`. Область та же, что у complexipy (прод-код без
# тестов). Порог 10 строк — как у CPD Sonar для
# Python (блок от 10 строк подряд). Комментарии, докстроки, импорты и сигнатуры
# в сравнение не входят: одинаковый заголовок функции копипастой не считается.
[tool.pylint.main]
ignore-paths = [
    ".*/tests/.*",
    "^tests/.*",
    ".*/conftest\\.py$",
    "^external/.*",
    ".*/external/.*",
]

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
