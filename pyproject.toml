[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ua"
# Релизная дисциплина: бампать при нарезке release/vX.Y.Z — стамп агента сверяет
# версию+коммит. Версии ВСЕХ четырёх манифестов обязаны совпадать: профили
# пинят друг друга точно, иначе можно собрать установку из разных коммитов.
# 0.3.0 — профили через extras (гейт зависимостей).
# 0.4.0 — профили стали отдельными дистрибутивами (гейт ФАЙЛОВ).
version = "0.4.0"
description = "GigaCode Universal Agent — полный агент (ядро + TUI + server)"
readme = "readme.md"
requires-python = ">=3.11"
# Мета не содержит кода агента: только лаунчер команд. Ставит все три профиля,
# поэтому короткая команда `uv tool install "gc-ua @ git+URL"` даёт полный агент.
dependencies = [
    "gc-cli==0.4.0",
    "gc-tui==0.4.0",
    "gc-server==0.4.0",
]

[project.optional-dependencies]
# Синоним полной установки: `gc-ua` и `gc-ua[all]` дают одно и то же. Extras
# умеют только ДОБАВЛЯТЬ, а база здесь уже полная — поэтому профилей «поменьше»
# через extras не существует, их роль выполняют отдельные дистрибутивы
# gc-cli / gc-tui / gc-server (см. docs/packaging.md).
all = []

[project.scripts]
gc-cli = "gc_ua_launcher:cli"
gc-ua = "gc_ua_launcher:tui"
gc-serve = "gc_ua_launcher:serve"
gc-mcp = "gc_ua_launcher:mcp"
gc-mcp-install = "gc_ua_launcher:mcp_install"

[tool.hatch.build.targets.wheel]
sources = ["meta"]
only-include = ["meta"]

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    "pytest-rerunfailures>=16.4",
    { include-group = "test" },
]
test = [
    # Раньше жили в runtime-dependencies и приезжали каждому пользователю.
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "office-mcp",
    "harbor>=0.16; python_version >= '3.12'",
    # Тестовый набор гоняет и TUI, и server, и swarm — но сторонние пакеты
    # перечислены НАПРЯМУЮ, а НЕ через "gc-ua[tui,server]". Иначе uv поставил бы
    # соседей editable, скопировав tui/ и server.py в site-packages, а
    # site-packages идёт в sys.path раньше пути на <repo>/src — и dev-цикл начал
    # бы молча исполнять устаревшую копию.
    "textual>=0.55",
    "rich>=13",
    "pygments>=2.13",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packaging/*"]

[tool.uv.sources]
# uv читает эти sources и у git-зависимости, поэтому профили приезжают из ТОГО
# ЖЕ коммита и по ТОМУ ЖЕ URL, который набрал пользователь — токены приватного
# репозитория и форки продолжают работать. PEP 508 direct reference вшил бы URL
# в METADATA и это сломал бы.
gc-cli = { workspace = true }
gc-tui = { workspace = true }
gc-server = { workspace = true }
office-mcp = { path = "external/office-mcp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
