[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ua"
# Релизная дисциплина (спека 2026-07-11-config-foundation): бампать при нарезке
# release/vX.Y.Z — стамп агента сверяет версию+коммит, notice «обновлён» берёт отсюда.
version = "0.0.1"
description = "GigaCode Universal Agent — TUI/CLI клиент агента GigaCode"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "requests[socks]",
    "trafilatura",
    "readability-lxml",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "httpx-sse>=0.4.0",
    "mcp==1.26.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "textual>=0.55",
    "rich>=13",
]

[project.scripts]
gc-cli = "cli:main"
gc-ua = "tui:main"
gc-mcp-install = "mcp_runtime.install_cli:main"
gc-mcp = "mcp_runtime.cli:main"

[project.optional-dependencies]
dev-tui = [
    "textual>=0.85",
    "rich>=13",
    "pytest-textual-snapshot>=1.0",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src", "recommended_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"
"skills" = "skills"
"config.default.yml" = "config.default.yml"
"recommended_mcp/config.yml" = "recommended_mcp/config.yml"
"external/ddgs-mcp" = "external/ddgs-mcp"

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    "pytest-rerunfailures>=16.4",
    { include-group = "test" },
]
test = [
    "office-mcp",
    "harbor>=0.16; python_version >= '3.12'",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
office-mcp = { path = "external/office-mcp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
