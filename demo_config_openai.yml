backend:
  # responses | chat_completions
  api_mode: chat_completions
  completions_url: "https://api.openai.com/v1/chat/completions"
  chat_completions_max_tokens: 32768
  # OpenAI для ряда моделей требует max_completion_tokens, а не max_tokens.
  use_max_tokens_param: false
  # Для OpenAI включаем strict-нормализацию tools schema.
  openai_strict_tools_schema: true

  # OpenAI-specific параметры тела запроса.
  chat_completion_kwargs:
    # Для некоторых OpenAI-моделей (например, gpt-5.5) поддерживается только
    # дефолтное значение temperature (1).
    temperature: 1.0
    top_p: 1.0

  # HTTP headers для chat/completions.
  chat_completion_headers:
    Authorization: "Bearer <YOUR_OPENAI_API_KEY>"

  use_ssl: true
  use_retry: true

# Вспомогательные LLM (summary, finish gate, intent scope).
chat_completions:
  llm:
    max_tokens: 8192
    completion_kwargs:
      reasoning_effort: none

agent:
  model: gpt-5.5
  system_prompt_id: v1
  use_server_subagents: false
  use_local_subagents: true
  subagent_max_steps: 100
  client_name: mini_cli_pub_agent_1
  x_cl_id: "12345"
  verbose: true
  stop_tools: []
  server_tool_prefix: system
  max_steps: 1000
  no_tool_call_max_count: 5
  strict_turn_finish_validation: true
  tool_output_inline_max_chars: 10000
  stored_tool_outputs_max_entries: 50

logging:
  full_log_backend: false
  console_trace: true
  dump_storage: false
  save_logs: true

paths:
  # Relative paths are resolved from config.yml directory.
  agent_md_path: "prompts/demo_cli_agent.md"
  # chat_completions_system_prompt_path: "prompts/chat_completions_system_prompt.md"
  # threads_data_path: ""
  # skills_data_path: ""
  # logs_dump_dir: ""

working_memory:
  max_chars_goal: 2000
  max_chars_constraints: 4000
  max_chars_state: 6000
  max_chars_knowledge: 8000
  total_budget_chars: 20000

tool_usage_notice:
  - tool_name: session_memory
    step_messages_count: 10
    notice_message: "You have not used session memory for some steps. Review/update thread memory if needed."
project_memory:
  enable_project_memory_notice: true
  check_interval_messages: 5
  max_chars: 20000
  max_append_chars: 5000

summary:
  chat_completions_summary_trigger_chars: 200000
  chat_completions_summary_turn_end_trigger_chars: 120000
  incremental_batch_chars: 280000
  max_message_chars: 30000
  max_dialogue_chars: 1000000
  max_accumulated_summary_chars: 60000
  last_dialog_steps_count: 4
  last_dialog_step_message_max_chars: 6000

security:
  command_moderation:
    mode: deny
    allowed_command_examples: []
  write_guard:
    enabled: true
    extra_paths: []
  url_policy:
    enabled: false
    allowed_schemes: ["http", "https"]
    url_blacklist: []
  download:
    download_dir: downloads
    max_bytes: 52428800

mcp:
  servers:
    # gc-mcp-install --config recommended_mcp/config.local.yml
    # gc-cli -a … — автозапуск HTTP-daemon'ов (science); stdio MCP из recommended_mcp/venv
    office:
      transport: stdio
      command: office-mcp
      args: ["--transport", "stdio", "--allow-any"]
      server-name: office
      description: Read office documents (pdf, docx, xls, xlsx, pptx, csv, html, msg) as markdown
    science:
      transport: stream_http
      url: http://127.0.0.1:8765/mcp
      server-name: science
      description: Unified scientific literature search across 10 public APIs
    duckduckgo_search:
      transport: stdio
      command: ddgs-mcp
      server-name: duckduckgo
      description: Web and news search via DuckDuckGo (DDGS)
  meta:
    tools-cache-ttl: 3600
    request_timeout_sec: 600
    # Манифест для gc-cli -a: не задан → config.local.yml (если есть), иначе config.yml
    # recommended-mcp-manifest: recommended_mcp/config.yml
