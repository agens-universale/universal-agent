# =============================================================================
# demo_profile.yml — полный референс профиля.
# Как это устроено — docs/configuration.md, раздел «Профили и уровни моделей».
#
# Что такое профиль: YAML-файл в одном из двух корней поиска —
#   <project>/.gc/profiles/<имя>.yml   (проектный корень, выигрывает при тёзке)
#   <рядом с базовым config.yml>/profiles/<имя>.yml   ("базовый" корень)
# Активируется указателем profile: <имя> (в config.yml, --profile, /profiles).
# Контент профиля мержится ПОВЕРХ всех файловых слоёв (включая проектный
# config.yml), но ПОД CLI-аргументами и сессионными тогглами.
#
# Профиль — частичный конфиг: любая обычная секция config.yml (гварды,
# суммаризация, agent, …) как оверлей + опциональные секции реестра моделей
# models/slots/assign (та же схема, что и в config.yml). От одной
# строки до почти полного config.yml. Единственный запрещённый ключ — сам
# "profile" (анти-рекурсия: профиль не может выбрать другой профиль).
#
# Этот файл — не рабочий конфиг, а СПРАВОЧНИК возможностей: показывает все
# формы записи разом. Настоящий профиль обычно короче (несколько строк).
# =============================================================================

# -----------------------------------------------------------------------------
# models: реестр именованных моделей. Ключ словаря — АЛИАС (язык slots/assign),
# не провайдерский id. Зарезервированные имена алиасов: light/default/max/auto.
# -----------------------------------------------------------------------------
models:
  # --- Полная форма записи: все возможные поля одной модели ---
  flash:
    model: qwen/qwen-2.5-flash              # провайдерский id; опущен → id = алиас
    url: https://openrouter.ai/api/v1/chat/completions
    # Адрес и токен — ПАРА: задаёшь один — задавай и второй. Запись без url и без
    # token наследует пару целиком из ЭФФЕКТИВНОЙ секции backend (после мержа всей
    # стопки, включая этот же профиль, если он и её перекрывает); token: "" —
    # «сервер не требует авторизации»; значение нормализуется в "Bearer <token>"
    # (уже с префиксом — не дублируется).
    token: "${ENV:OPENROUTER_API_KEY}"       # env-интерполяция работает и внутри профиля
    pricing: {input: 12, output: 48}         # тариф модели (формат ModelTariff); главнее pricing.models[<id>]
    backend:                                 # транспорт поверх эффективного backend (ssl, timeout, headers)
      use_max_tokens_param: false
      # Схема тулов этого алиаса в chat_completions. Нет ключа — глобальный backend.
      openai_strict_tools_schema: false
      send_tool_strict: true
    main:
      temperature: 1.0
      top_p: 1.0
      tool_choice: auto
      separate_reasoning: true
      chat_template_kwargs:
        enable_thinking: true
    auxiliary:
      temperature: 1.0
      top_p: 1.0
      separate_reasoning: false
      chat_template_kwargs:
        enable_thinking: false

  # --- Локальный сервер: свой адрес, ключа не требует ---
  glm-local:
    url: http://127.0.0.1:8014/v1/chat/completions
    token: ""    # «без авторизации»: адрес и токен задаются вместе (правило пары)
    # model нет → провайдерский id = "glm-local" (сахар для простых локальных сетапов)
    main:
      temperature: 1.0
      top_p: 1.0
      tool_choice: auto
      chat_template_kwargs:
        thinking: true
        reasoning_effort: high
    auxiliary:
      temperature: 1.0
      top_p: 1.0
      chat_template_kwargs:
        thinking: false
        reasoning_effort: none

  # --- Ещё один пример полной формы, со своим токеном (без наследования) ---
  deepseek-max:
    model: deepseek/deepseek-chat-v3-0324
    url: https://api.provider.example/v1/chat/completions
    # Необязательный ключ: `:-` — пустое умолчание. Без него незаданная
    # переменная роняет загрузку (`${ENV:VAR}` строгий).
    token: "${ENV:DEEPSEEK_API_KEY:-}"
    strip_think: false                   # как дефолт кода: копировать мысль; true — вырезать
    main:
      temperature: 1.0
      top_p: 1.0
      tool_choice: auto
      chat_template_kwargs:
        thinking: true
        reasoning_effort: high
    auxiliary:
      temperature: 1.0
      top_p: 1.0
      chat_template_kwargs:
        thinking: false
        reasoning_effort: none

  # --- Модель со зрением — для «глаз» (assign.vision ниже) ---
  qwen-vl:
    model: qwen/qwen2.5-vl-72b-instruct
    url: https://openrouter.ai/api/v1/chat/completions
    token: "${ENV:OPENROUTER_API_KEY}"

# -----------------------------------------------------------------------------
# slots: уровни — УКАЗАТЕЛИ в models (не копии). Одна модель может стоять в
# нескольких уровнях; переключить уровень на другую модель = одна строка.
# Не заданный слот резолвится матрицей фоллбэков (light: light→default→max;
# default: default→max→light; max: max→default→light).
# -----------------------------------------------------------------------------
slots:
  light: flash          # быстрая/дешёвая модель — судьи и служебные вызовы
  default: glm-local     # основная рабочая лошадка
  max: deepseek-max      # самая умная — сложные ходы

# -----------------------------------------------------------------------------
# assign: привязки потребителей → УРОВЕНЬ (light/default/max, индирекция через
# slots) ИЛИ АЛИАС (жёсткий пин конкретной модели в обход уровней). "auto"
# справа запрещён (это политика выбора уровня, а не модель/уровень).
# Потребитель без привязки идёт активной моделью (текущий /level или auto).
# -----------------------------------------------------------------------------
assign:
  subagents:
    # Все семь субагентов канонического реестра (tools/subagents/registry.py),
    # поимённо — каждый со своим назначением. Порядок значения справа —
    # уровень (индирекция через slots) ИЛИ алиас (жёсткий пин), как у всех assign.
    subagent_worker: light             # короткие исполнительские шаги — не нужен топ-интеллект
    subagent_code_generator: default   # генерация кода — рабочая лошадка
    subagent_code_planner: default     # планирование кода — рабочая лошадка
    subagent_planner: deepseek-max     # верхнеуровневое планирование — жёсткий пин на max-модель алиасом
    subagent_critic: max               # критика/ревью решений — нужен самый умный уровень
    subagent_code_reviewer: max        # ревью кода — нужен самый умный уровень
    subagent_special_agent: default    # генерация роли + вложенный цикл спец-агента

    # "*" — wildcard «все остальные субагенты, не перечисленные поимённо выше».
    # Порядок резолюции для конкретного субагента: точный agent_name в assign.subagents
    # → "*" (если задан) → активная модель (текущий /level или auto), если ни того,
    # ни другого нет. Здесь "*" не нужен — все семь перечислены явно, но он
    # пригождается, когда хочется задать общее правило и точечно переопределить
    # один-два субагента (частая форма: только "*", без поимённых записей).
    "*": default

  # Все служебные потребители вне субагентов. Каждый — свой LLM-вызов
  # системы, привязка не обязательна (без неё — активная модель).
  finish_gate: light           # судья завершения хода (+ его JSON-retry)
  text_answer_judge: light     # судья текст-ответа (TUI adaptive bounce; переиспользует воронку finish_gate)
  command_judge: light         # судья модерации опасных команд/кода
  summary: light                # суммаризация: батчи треда, сжатие/починка, working-memory patch, /compact
  intent_scope: light          # intent-scope выжимки (per-tool и final_answer)
  memory_compaction: light     # компакция проектной памяти (long memory)
  vision: qwen-vl              # «глаза»: описывают изображение, если модель хода его не видит
                               # (тул fs_view_image); нужна модель со зрением — пин алиасом

  # auto_judge: классификатор уровня для режима auto (волна C). Ключ легален
  # уже с волны A, но пока ИНЕРТЕН — потребитель не вызывается, пока auto не
  # реализован. Без привязки статически резолвится в уровень default (это
  # единственный потребитель, для которого "без привязки → активная" не
  # действует — иначе классификатор выбирал бы модель сам себе, рекурсия).
  auto_judge: max

# -----------------------------------------------------------------------------
# Всё, что ниже, — обычные секции config.yml как ОВЕРЛЕЙ ("профиль = режим
# работы"). Любая секция AppConfig легальна здесь; флагманский практический
# кейс — гварды (у корп-профиля своя строгость, у домашнего — своя) + суммаризация.
# -----------------------------------------------------------------------------
security:
  command_moderation:
    enabled: true
    mode: deny                   # судья команд: строгий блок вместо ask
  write_guard:
    enabled: true
    mode: deny
    extra_paths:                  # список РАСШИРЯЕТ базовый (deep-merge: элемент
      - /etc                      # базового списка оверлей убрать не может)
      - ~/.ssh
  read_guard:
    enabled: true
    mode: deny
  url_policy:
    enabled: true
    mode: deny

summary:
  chat_completions_summary_trigger_chars: 150000
  # 0 — токенный порог выключен. Иначе input последнего главного запроса плюс хвост // 2.
  chat_completions_summary_trigger_tokens: 0
  # 0 — токенный turn-end выключен. Нет ключа — 60% от токенного mid-turn.
  chat_completions_summary_turn_end_trigger_tokens: 0
