# =============================================================================
# Дефолт-конфиг GigaCode Universal Agent (gc-ua).
# Авто-копируется в пользовательский config.yml при первом запуске
# (Windows: ~/.gc/, macOS/Linux: ~/.config/gc/).
# Полный документированный пример со всеми опциями — demo_config.yml.
#
# ПЕРЕД ПЕРВЫМ ЗАПРОСОМ впишите:
#   1) backend.completions_url — endpoint OpenAI-совместимого провайдера;
#   2) backend.chat_completion_headers.Authorization — токен доступа.
# =============================================================================

backend:
  api_mode: chat_completions
  # Впишите endpoint (OpenAI-совместимый chat/completions), напр.:
  #   https://routerai.ru/api/v1/chat/completions  (тогда use_ssl: true)
  completions_url: "http://your-backend:PORT/v1/chat/completions"
  chat_completions_max_tokens: 8096
  use_ssl: false
  use_max_tokens_param: true
  # true — провайдер требует OpenAI strict tools (все properties в required).
  # false — типично для GigaCode и non-OpenAI; при true локальная валидация всё равно
  # принимает omit semantic optional (x-optional-keys).
  openai_strict_tools_schema: false
  use_retry: true
  # HTTP-таймаут одного запроса к LLM (секунды). Дефолт 600 (10 минут).
  request_timeout_sec: 600
  # HTTP/SOCKS-прокси для backend-вызовов. null/пусто → из env
  # (HTTPS_PROXY/HTTP_PROXY/ALL_PROXY). Пример: "socks5h://proxy.example:1080"
  proxy: null
  chat_completion_headers:
    Authorization: "Bearer <ВПИШИТЕ_ТОКЕН>"

agent:
  model: "gigacode_agent_v1.6_rc"
  system_prompt_id: v1
  use_server_subagents: false
  use_local_subagents: true
  subagent_max_steps: 500
  client_name: gc_ua_agent
  x_cl_id: "12345"
  verbose: true
  stop_tools: []
  server_tool_prefix: system
  max_steps: 1000
  no_tool_call_max_count: 3
  strict_turn_finish_validation: true

# TUI: что рендерить во время стриминга (действует только при backend.stream: true;
# на счётчик токенов и индикатор не влияет — только контент).
tui:
  # Мастер-свитч live-стриминга в TUI (chat_completions). На CLI/server/swarm НЕ
  # влияет — там всегда non-stream (гейтится on_stream_delta, ставит только TUI).
  # Не задан → legacy backend.stream.
  stream: true
  # minimal (default) — только индикатор + счётчик; answer — прогрессивный ответ;
  # answer_reasoning — + строка-мысль «⠇ …».
  stream_display: minimal
  # adaptive bounce (только TUI): как поступать с текст-ответом без тула.
  #   deny  — всегда требовать tool-call (как CLI/server/swarm);
  #   judge — судья решает, полный ли это ответ (привет/объяснение → принять);
  #   allow — всегда принимать текст (ни bounce, ни судьи).
  text_answer_mode: judge
  finish_gate_mode: "smart"        # /gate: on — судья всегда; smart — судья только при вызовах инструментов; off — отключить (только TUI)
  # Только TUI: оставить лишь корневой AGENTS.md (L3), отбросив global (~/.config/gc)
  # и .gc/AGENTS.md. Игнорируется, если задан paths.agent_md_path (путь главнее).
  agentsmd_override: false
  # Bang-shell: префикс `!` в поле ввода → локальная shell-команда (не агент).
  bang_shell:
    enabled: true
    # null / omit / 0 = без лимита. Положительное N = авто-kill через N секунд.
    # timeout_sec: null
    max_output_bytes: 32768
    max_output_lines: 200
  file_view:
    enabled: true
    max_file_bytes: 67108864   # 64 MiB
    # null / omit = авто по высоте экрана; число = фиксированный шаг PgUp/PgDn.
    # page_lines: null

# Diff-TUI: visual review/approve/undo правок агента (не параметры fs return_diff).
diff_tui:
  cache_max_orig: 500          # LRU лимит .orig в cache-mode
  preview_context_lines: 50    # контекст в TUI visual diff / trace-preview
  full_file_max_lines: 300     # порог «весь файл» vs preview (adaptive)
  max_diff_chars: 100000       # усечение больших visual diff (0 = без лимита)

# Обновление агента (спека D)
update:
  check: auto            # auto | off — фоновая проверка новой версии при старте TUI
  extra_args: []         # доп. аргументы к uv tool install (корп-сеть: ["--system-certs"])

logging:
  full_log_backend: false
  console_trace: true
  dump_storage: false
  save_logs: true
  format: text                 # text — человекочитаемо; jsonl — структурный поток событий
  log_level: info              # debug | info | warning | error

paths:
  # Промпт роли запуска (agent_md). Пусто = ролевого промпта нет.
  # В CLI/server/swarm это единственный источник инструкций; задан → замещает всё.
  agent_md_path: ""

summary:
  # ~67–80k токенов истории — рассчитано на контекст моделей ~131k (под меньшие
  # модели снижай; под 262k — поднимай ~2× до ~360–400k). batch (×1.4) и
  # turn-end-trigger (×0.6) выводятся отсюда.
  chat_completions_summary_trigger_chars: 200000
  max_message_chars: 50000
  max_dialogue_chars: 1000000
  max_accumulated_summary_chars: 20000
  last_dialog_steps_count: 5
  last_dialog_step_message_max_chars: 1500

# Доп. strip-теги для for_model / aux LLM. <think> всегда on; extras — сюда.
strip_tags_projection:
  tags: []

intent_scope:
  # Финальная проза, закрывающая ход, пишется в intent log:
  # <= порога — как есть (raw); > порога — LLM-саммари (кап max_summary_chars).
  max_final_answer_raw_chars: 2000

security:
  command_moderation:
    enabled: true
    mode: ask
    allowed_command_examples: []
    denied_command_examples: []
  write_guard:
    enabled: true
    mode: ask
    extra_paths: []
  url_policy:
    enabled: true
    mode: ask
    allowed_schemes: ["http", "https"]
    # Blacklist хостов / URL-паттернов.
    # Матчинг: fnmatch по host и по полному URL (case-insensitive);
    # "*.suffix" матчит любой ПОДДОМЕН (apex без поддомена не матчится).
    # Примеры правил:
    #   "host"           — точный хост;
    #   "*.suffix"       — любой поддомен suffix;
    #   "10.*"           — fnmatch wildcard;
    #   "172.1[6-9].*"   — fnmatch character class.
    # SSRF-blacklist: cloud metadata, loopback/link-local, RFC1918.
    # Расширить — .gc/config.yml (merge добавляет, не сбрасывает).
    url_blacklist:
      # --- Cloud metadata endpoints ---
      - "169.254.169.254"            # AWS / GCP / OpenStack IMDS
      - "metadata.google.internal"   # GCP metadata (apex)
      - "*.metadata.google.internal" # GCP metadata (поддомены)
      - "metadata.azure.com"         # Azure metadata (apex)
      - "*.metadata.azure.com"       # Azure metadata (поддомены)
      # --- Loopback / link-local ---
      - "localhost"
      - "127.*"                      # весь loopback-блок 127.0.0.0/8
      - "::1"                        # IPv6 loopback
      - "0.0.0.0"
      - "169.254.*"                  # link-local (включая IMDS-подсеть)
      # --- RFC1918 private networks ---
      - "10.*"                       # 10.0.0.0/8
      - "192.168.*"                  # 192.168.0.0/16
      - "172.1[6-9].*"               # 172.16-19 (часть 172.16.0.0/12)
      - "172.2[0-9].*"               # 172.20-29
      - "172.3[0-1].*"               # 172.30-31
  read_guard:
    enabled: true
    mode: ask
    allowed_read_roots: []
    allowed_read_paths:
      - "~/.local/share/gc/skills"
      - "<launch_root>/.gc/skills"
    denied_read_paths:
      - "~/.ssh"
      - "~/.aws"
      - "~/.config/gcloud"
      - "~/.gnupg"
      - "/etc/ssl/private"
      - "/proc"
      - "/sys"
      - "~/.local/state/gc"
      - "<launch_root>/.gc"
    denied_file_patterns:
      - ".env"
      - ".env.*"
      - "*id_rsa*"
      - "*id_ed25519*"
      - "*.pem"
      - "*credentials*.json"
      - "*.sqlite"
    denied_extensions:
      - ".key"
      - ".pfx"
      - ".jks"
  protected_paths:
    enabled: true
    extra: []

# Подсчёт токенов и стоимости прогона. Токены считаются всегда; цена показывается
# только при enabled: true и наличии тарифа (input/output).
# Верхнеуровневые input/output — дефолтный тариф под agent.model (имя модели не нужно).
# models: — переопределение под конкретные модели (мультимодельные сетапы).
pricing:
  enabled: true
  currency: "₽"
  per_tokens: 1000000          # ставки указаны за столько токенов
  input: 0                     # впишите реальные ставки, когда будут известны
  output: 0
  # cache_read: 0              # опц.; нет → кэш биллится как input
