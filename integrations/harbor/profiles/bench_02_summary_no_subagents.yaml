# Bench 2x2 (2/4): summary ON, subagents OFF. Values verbatim from bench_configs/04_summary_subagents.yml.
import_path: adapters.gc_cli_external:GcCliExternal
model: openai/qwen_next_vanilla
agent_kwargs:
  gc_cli_config:
    agent.max_steps: 1000
    agent.no_tool_call_max_count: 5
    agent.use_server_subagents: false
    agent.use_local_subagents: false           # <-- 01/02 = false, 03/04 = true
    agent.subagent_max_steps: 100
    agent.subagent_finish_gate_max_iterations: 3
    agent.strict_turn_finish_validation: true
    agent.finish_gate_max_iterations: 10
    agent.stop_tools: [turn_ask_human, project_memory, fs_view_image]
    agent.disable_skills: [supercoder, topic-research, complex-task-solver, science-article-creator, articles]
    agent.tool_output_inline_max_chars: 10000
    agent.stored_tool_outputs_max_entries: 50
    agent.inject_tool_fields:
      reason: "At most 10 words: why this call, what you expect."
    backend.chat_completion_kwargs:
      separate_reasoning: true
      chat_template_kwargs: {enable_thinking: false}
      tool_choice: auto
    summary:                       # <-- present only in 02 & 04
      chat_completions_summary_trigger_chars: 150000
      chat_completions_summary_turn_end_trigger_chars: 90000
      incremental_batch_chars: 210000
      max_message_chars: 16000
      max_dialogue_chars: 400000
      last_dialog_steps_count: 3
      last_dialog_step_message_max_chars: 4000
polar:
  model_served: qwen_next_vanilla
  node_id: local-proxy-node
harbor:
  environment: docker
  n_concurrent_trials: 1
  agent_timeout_multiplier: 6.0
  verifier_timeout_multiplier: 6.0
