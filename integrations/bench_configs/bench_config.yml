# Bench 2x2 (2/4): summary ON, subagents OFF.
# Шаблон gc-cli External для config_bench (Hydra group agent_configs).
# В config_bench: agent_profile.model_name: ${model_name}
#
# gc_cli_config — пути настроек через точку (agent.max_steps) и секции. Сборка:
#   schema defaults < bench defaults адаптера < этот блок < runtime (url/model).
# Здесь перечислены ВСЕ поведенческие ключи, чтобы слой схемы/bench не подмешивал
# скрытых значений. Не пишем: completions_url, model (runtime), пути промптов и
# skills_data_path (адаптер резолвит bundled prompts/skills и контейнерный skills root).
import_path: adapters.gc_cli_external:GcCliExternal
model: openai/${model_name}
agent_kwargs:
  gc_cli_config:
    # --- backend ---
    backend.api_mode: chat_completions
    os_backend: harbor
    agent.harbor_exec_init: bashrc              # model-facing exec читает profile/bashrc (SWE testbed); null = raw
    backend.chat_completions_max_tokens: 32768
    backend.chat_completions_min_response_tokens: 1024  # минимум лимита для ретраев
    backend.use_max_tokens_param: true
    backend.openai_strict_tools_schema: false
    backend.use_ssl: false
    backend.cert_path: null
    backend.key_path: null
    backend.use_retry: true
    backend.request_timeout_sec: 600     # таймаут одного HTTP-запроса к LLM (длинные генерации на медленном vllm)
    backend.proxy: null
    backend.stream: true                         # legacy; CLI/harbor non-stream, канон — tui.stream
    backend.chat_completion_headers: {}
    backend.chat_completion_kwargs:              # {} НЕ сбрасывает bench-слой (deep-merge dict)
      chat_template_kwargs:
        enable_thinking: false
      tool_choice: auto
    chat_completions.auxiliary_llm:
      max_tokens: 24576                # aux LLM: summary / intent-scope (потолок)
      judge_max_tokens: 24576          # finish-gate / command_moderation (запас под мысль модели)
      # {} = schema default (без vendor-ключей). Не наследует и не гасит agent kwargs.
      # Если у агента thinking вкл — задайте anti-thinking явно (см. ua_qwen / dsv4).
      completion_kwargs: {}

    # --- agent loop ---
    agent.system_prompt_id: v1
    agent.max_steps: 1000                      # потолок шагов (tool-вызовов) агента за ран; предохранитель от бесконечных запусков
    agent.no_tool_call_max_count: 1000         # бюджет подряд идущих «плохих» ответов (нет tool call / ошибка аргументов); исчерпан → ран завершается
    agent.max_unknown_tool_repeats: 1000
    agent.session_token_limit: null            # выкл
    agent.max_tool_calls: null                 # выкл
    agent.limit_trace_summary: false
    agent.use_server_subagents: false          # серверные субагенты (через REST) выключены
    agent.use_local_subagents: false           # локальные in-process субагенты выключены; оркестратор-прелюдия не подмешивается в промпт
    agent.subagent_max_steps: 100              # лимит шагов одного субагента (действует только при включённых субагентах)
    agent.subagents_dir: null
    agent.subagents_max_count: 20
    agent.strict_turn_finish_validation: true  # строгая валидация turn_finish: финальный отчёт обязан пройти проверки, иначе агент дорабатывает
    agent.finish_gate_max_iterations: 10       # то же для основного агента: макс. кругов finish-гейта перед принятием ответа
    agent.subagent_finish_gate_max_iterations: 3  # сколько раз finish-гейт может завернуть финальный ответ субагента на доработку
    agent.client_name: mini_cli_pub_agent_1
    agent.x_cl_id: "12345"
    agent.trace_id_header_name: null
    agent.trace_header_enabled: false
    agent.verbose: true
    agent.server_tool_prefix: system
    agent.limit_project_metadata: false
    agent.model_steering: ""
    agent.exec_timeout_sec: 600                # дефолт timeout для exec_command / exec_python, если модель не передала
    agent.tool_output_inline_max_chars: 10000  # столько символов вывода тула инлайнится в диалог; остальное — в стор полных выводов
    agent.exec_output_capture_max_chars: 40000  # потолок захвата stdout/stderr на поток: 20k головы + 20k настоящего хвоста
    agent.exec_output_preview_edge_chars: 3000  # каждый край front-loaded preview длинного потока; 0 — без preview
    agent.stored_tool_outputs_max_entries: 50  # ёмкость стора полных выводов (агент может дочитать через session_read_stored_tool_output)
    agent.inject_tool_fields:                  # инжект синтетического поля в JSON Schema КАЖДОГО тула
      reason: "At most 10 words: why this call, what you expect."
    agent.stop_tools: [turn_ask_human, project_memory,
                 fs_save_base64_file, exec_calculator,
                 exec_sleep, exec_python, exec_fetch_url,
                 turn_intermediate_reply, session_think,
                 session_read_user_intent_log, fs_search_and_replace,
                 session_compact, skills_list, skills_load,
                 skills_run_script, skills_read_reference, skills_read_asset,
                 download_file]       # убрать тулы из реестра: спрашивать человека в автономном бенче нельзя, межзапусковая память не нужна
    agent.disable_skills: [supercoder, topic-research, complex-task-solver, science-article-creator, articles]  # скрыть нерелевантные бенчу скиллы из реестра

    # --- summary ---
    summary:                      # компакция истории (работает только в chat_completions-режиме)
      chat_completions_summary_trigger_chars: 400000   # объём диалога (символы), после которого запускается суммаризация
      chat_completions_summary_turn_end_trigger_chars: 350000  # порог компакции на границе хода (turn end)
      incremental_batch_chars: 480000    # сколько истории сжимается за одну инкрементальную суммаризацию
      max_message_chars: 16000           # сообщение длиннее этого урезается перед подачей в суммаризатор
      max_dialogue_chars: 800000         # жёсткий потолок хвоста диалога
      last_dialog_steps_count: 3         # столько последних шагов держим несжатыми (свежий контекст)
      last_dialog_step_message_max_chars: 4000  # лимит символов на сообщение в этих последних шагах
      max_accumulated_summary_chars: 20000
      intent_log_preview_chars: 10000

    # --- quality / memory / notices ---
    quality_gate:
      max_dialogue_chars: 200000
      max_message_chars: 5000
    working_memory:
      max_chars_goal: 2000
      max_chars_constraints: 4000
      max_chars_state: 6000
      max_chars_knowledge: 8000
      total_budget_chars: 20000
    tool_usage_notice: []
    intent_scope:
      tools: {}

    # --- security (bench: гарды OFF, иначе контейнерные пути режутся по ФС раннера) ---
    security.command_moderation:
      enabled: false
      mode: allow
    security.write_guard:
      enabled: false
    security.read_guard:
      enabled: false
    security.url_policy:
      enabled: false
    security.protected_paths:
      enabled: false
      extra: []

    # --- fs / mcp / pricing / logging ---
    fs_tools:
      max_read_bytes: 8388608
      max_mutate_bytes: 16777216
    mcp.servers: {}
    pricing:
      enabled: false
    logging.save_logs: false
    logging.console_trace: false
    logging.format: text
    logging.log_level: info
    logging.redact_secrets:
      enabled: false
    logging:
      full_log_backend: false
    strip_tags_projection:
      tags: []
polar:
  model_served: ${model_name}
  node_id: local-proxy-node
harbor:
  environment: docker
  n_concurrent_trials: 1
  agent_timeout_multiplier: 6.0
  verifier_timeout_multiplier: 6.0
