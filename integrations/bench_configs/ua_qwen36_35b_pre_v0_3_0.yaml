# UA pre-v0.3.0 profile: copy of uag_minimal_no_skills (summary ON, subagents OFF, no skills)
# plus the agent config keys new in v0.3.0. Image: gc-cli-harbor:v0.3.0_260910.
# Keys are deep-merged into gc-cli config_dict without schema validation: a typo is silently ignored.
# Шаблон gc-cli External для config_bench (Hydra group agent_configs).
# В config_bench: agent_profile.model_name: ${model_name}
#
# gc_cli_config — плоские ключи config_dict. Сборка:
#   schema defaults < bench defaults адаптера < этот блок < runtime (url/model).
# Здесь перечислены ВСЕ поведенческие ключи, чтобы слой схемы/bench не подмешивал
# скрытых значений. Не пишем: completions_url, model (runtime), пути промптов и
# skills_data_path (адаптер резолвит bundled prompts/skills и контейнерный skills root).
import_path: adapters.gc_cli_external:GcCliExternal
model_name: ???
model: openai/${model_name}
agent_kwargs:
  gc_cli_config:
    # --- backend ---
    backend_api_mode: chat_completions
    os_backend: harbor
    chat_completions_max_tokens: 32768
    chat_completions_min_response_tokens: 1024  # минимум лимита для ретраев
    use_max_tokens_param: true
    openai_strict_tools_schema: false    # не требовать все properties в required (GigaCode / non-OpenAI)
    send_tool_strict: false              # не слать function.strict на провод; vllm/sglang на него иногда дают 500
    use_ssl: false
    cert_path: null
    key_path: null
    use_retry: true
    backend_request_timeout_sec: 600         # таймаут одного HTTP-запроса к LLM (длинные генерации на медленном vllm)
    proxy: null
    stream: true                             # legacy; CLI/harbor non-stream, канон — tui_stream
    chat_completion_headers: {}
    chat_completion_kwargs:                  # {} НЕ сбрасывает bench-слой (deep-merge dict)
      chat_template_kwargs:
        enable_thinking: false
      tool_choice: auto
    chat_completions_params:
      llm:
        max_tokens: 8192                     # aux LLM: summary / intent-scope
        judge_max_tokens: 10000              # finish-gate / command_moderation
        completion_kwargs: {}

    # --- agent loop ---
    system_prompt_id: v1
    max_steps: 1000                          # потолок шагов (tool-вызовов) агента за ран; предохранитель от бесконечных запусков
    no_tool_call_max_count: 1000             # бюджет подряд идущих «плохих» ответов (нет tool call / ошибка аргументов); исчерпан → ран завершается
    max_unknown_tool_repeats: 1000           # dsv4 пинит 1000
    session_token_limit: null                # выкл
    max_tool_calls: null                     # выкл
    limit_trace_summary: true                # аварийная LLM-сводка трейса при step/tool/token limit
    use_server_subagents: false              # серверные субагенты (через REST) выключены
    use_local_subagents: false               # локальные in-process субагенты выключены; оркестратор-прелюдия не подмешивается в промпт
    subagent_max_steps: 100                  # лимит шагов одного субагента (действует только при включённых субагентах)
    subagents_dir: null
    subagents_max_count: 20
    strict_turn_finish_validation: true      # строгая валидация turn_finish: финальный отчёт обязан пройти проверки, иначе агент дорабатывает
    finish_gate_max_iterations: 10           # то же для основного агента: макс. кругов finish-гейта перед принятием ответа
    subagent_finish_gate_max_iterations: 3   # сколько раз finish-гейт может завернуть финальный ответ субагента на доработку
    client_name: mini_cli_pub_agent_1
    x_cl_id: "12345"
    trace_id_header_name: null
    trace_header_enabled: false
    verbose: true
    server_tool_prefix: system
    limit_project_metadata: false
    model_steering: ""
    exec_timeout_sec: 600                    # дефолт timeout_seconds для exec_command / exec_python, если модель не передала
    tool_output_inline_max_chars: 20000      # столько символов вывода тула инлайнится в диалог; остальное — в стор полных выводов
    exec_output_capture_max_chars: 40000     # потолок захвата stdout/stderr на поток: 20k головы + 20k настоящего хвоста
    exec_output_preview_edge_chars: 3000     # каждый край front-loaded preview длинного потока; 0 — без preview
    walk_output_max_chars: 50000000          # потолок внутренних walk/grep каналов, fail-closed
    stored_tool_outputs_max_entries: 50      # ёмкость стора полных выводов (агент может дочитать через session_read_stored_tool_output)
    inject_tool_fields:                      # инжект синтетического поля в JSON Schema КАЖДОГО тула
      reason: "One short, concrete sentence explaining the immediate purpose of this tool call, why this tool is the right next step, and what observation/change/deliverable you expect; avoid generic filler."
    loop_detector:
      enabled: true                          # notice модели на повтор идентичного tool call
    stop_tools:  # убрать тулы из реестра: спрашивать человека в автономном бенче нельзя, межзапусковая память не нужна
      - turn_ask_human
      - project_memory
      - fs_save_base64_file
      - exec_calculator
      - exec_sleep
      - exec_python
      - exec_fetch_url
      - turn_intermediate_reply
      - session_think
      - session_read_user_intent_log
      - session_compact
      - skills_list
      - skills_load
      - skills_run_script
      - skills_read_reference
      - skills_read_asset
      - download_file
    disable_skills:  # скрыть все скиллы
      - articles
      - autonomous-benchmark-agent
      - codebase
      - complex-task-solver
      - computer-use
      - default-coworker
      - science-article-creator
      - skill-creator
      - supercoder
      - topic-research

    # --- summary ---
    summary_params:                          # компакция истории (работает только в chat_completions-режиме)
      chat_completions_summary_trigger_chars: 200000   # объём диалога (символы), после которого запускается суммаризация
      chat_completions_summary_turn_end_trigger_chars: 160000  # порог компакции на границе хода (turn end)
      incremental_batch_chars: 210000        # сколько истории сжимается за одну инкрементальную суммаризацию
      max_message_chars: 16000               # сообщение длиннее этого урезается перед подачей в суммаризатор
      max_dialogue_chars: 400000             # жёсткий потолок хвоста диалога
      last_dialog_steps_count: 3             # столько последних шагов держим несжатыми (свежий контекст)
      last_dialog_step_message_max_chars: 4000  # лимит символов на сообщение в этих последних шагах
      max_accumulated_summary_chars: 20000
      intent_log_preview_chars: 10000

    # --- quality / memory / notices ---
    quality_gate_params:
      max_dialogue_chars: 200000
      max_message_chars: 5000
    working_memory_params:
      max_chars_goal: 2000
      max_chars_constraints: 4000
      max_chars_state: 6000
      max_chars_knowledge: 8000
      total_budget_chars: 20000
    tool_usage_notice: []
    intent_scope_params:
      tools: {}

    # --- security ---
    # write/read/url — bench_defaults уже OFF. command_moderation.enabled остаётся
    # схемным true; mode=allow судью не вызывает. protected_paths в flatten нет:
    # без ключа protection_enabled() считает ON.
    command_moderation:
      enabled: false
      mode: allow
    write_guard:
      enabled: false
    read_guard:
      enabled: false
    url_policy:
      enabled: false
    protected_paths:
      enabled: false
      extra: []

    # --- fs / mcp / pricing / logging ---
    fs_tools:
      max_read_bytes: 8388608
      max_mutate_bytes: 16777216
    mcp-servers: {}
    pricing:
      enabled: false
    save_logs: false
    console_trace: false
    logging_format: text
    log_level: info
    redact_secrets:
      enabled: false
    logging_params:
      full_log_backend: false
    strip_tags_projection:
      strip_think: true                      # не класть reasoning_content в messages; false = вернуть модели
      tags: []
polar:
  model_served: ${model_name}
  node_id: local-proxy-node
harbor:
  environment: docker
  n_concurrent_trials: 1
  agent_timeout_multiplier: 6.0
  verifier_timeout_multiplier: 6.0
