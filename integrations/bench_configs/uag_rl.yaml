# @package _global_

# Fleet agent profile based on the shared UAG v0.6 Qwen3-Coder-Next ep5 profile.
# Copy to examples/harbor_new/configs/harbor/agent/uag_rl.yaml and select
# harbor/agent: uag_rl in the experiment defaults. Use an image that ships
# the RL system prompt below.
# The reference 200k threshold is retained. If compaction fires, its summary
# begins a new model context and appears as a user step in the full Harbor trace.

harbor_job:
  agents:
    - &uag
      name: uag
      model_name: openai/${experiment.model_name}
      import_path: adapters.gc_cli_external:GcCliExternal
      kwargs: &uag_kwargs
        api_base: ${system.polar.host_api_base}
        session_id: __FLEET_SESSION_ID__
        gc_cli_config: &uag_config
          text_answer_mode: allow
          paths:
            chat_completions_system_prompt_path: /opt/gc-harbor-adapters/prompts/chat_completions_system_prompt_rl.md
          backend:
            api_mode: chat_completions
            chat_completions_max_tokens: 32768
            chat_completions_min_response_tokens: 1024
            use_max_tokens_param: true
            openai_strict_tools_schema: false
            send_tool_strict: true
            retry_embedded_choice_errors: true
            claude_prompt_cache: null
            use_ssl: false
            cert_path: null
            key_path: null
            use_retry: true
            request_timeout_sec: 600
            proxy: null
            stream: true
            chat_completion_headers: {}
            chat_completion_kwargs:
              separate_reasoning: true
              chat_template_kwargs:
                enable_thinking: true
                preserve_thinking: true
              tool_choice: auto
          os_backend: harbor
          agent: &uag_settings
            stop_on_no_tool_response: true
            harbor_exec_init: bashrc
            system_prompt_id: v1
            max_steps: 1000
            no_tool_call_max_count: 1000
            max_unknown_tool_repeats: 1000
            session_token_limit: null
            max_tool_calls: null
            limit_trace_summary: true
            use_server_subagents: false
            use_local_subagents: false
            subagent_max_steps: 100
            subagents_dir: null
            subagents_max_count: 20
            strict_turn_finish_validation: true
            finish_gate_max_iterations: 10
            subagent_finish_gate_max_iterations: 3
            finish_gate_use_rule_hints: false
            client_name: mini_cli_pub_agent_1
            x_cl_id: "12345"
            trace_id_header_name: null
            trace_header_enabled: false
            verbose: true
            server_tool_prefix: system
            limit_project_metadata: false
            model_steering: ""
            exec_timeout_sec: 600
            tool_output_inline_max_chars: 20000
            exec_output_capture_max_chars: 40000
            exec_output_preview_edge_chars: 3000
            walk_output_max_chars: 50000000
            stored_tool_outputs_max_entries: 50
            inject_tool_fields:
              reason: "One short, concrete sentence explaining the immediate purpose of this tool call, why this tool is the right next step, and what observation/change/deliverable you expect; avoid generic filler."
            loop_detector:
              enabled: true
            stop_tools:
              - turn_ask_human
              - project_memory
              - fs_save_base64_file
              - exec_calculator
              - exec_sleep
              - exec_python
              - exec_fetch_url
              - turn_intermediate_reply
              - session_think
              - session_read_user_intent_log
              - session_compact
              - fs_view_image
              - skills_list
              - skills_load
              - skills_run_script
              - skills_read_reference
              - skills_read_asset
              - download_file
            disable_skills:
              - articles
              - autonomous-benchmark-agent
              - codebase
              - complex-task-solver
              - computer-use
              - default-coworker
              - science-article-creator
              - skill-creator
              - supercoder
              - topic-research
          chat_completions:
            auxiliary_llm:
              max_tokens: 8192
              judge_max_tokens: 10000
              subagent_role_max_tokens: 4096
              completion_kwargs:
                separate_reasoning: false
                chat_template_kwargs:
                  enable_thinking: false
          summary:
            chat_completions_summary_trigger_chars: 0
            chat_completions_summary_turn_end_trigger_chars: 0
            chat_completions_summary_trigger_tokens: 200000
            chat_completions_summary_turn_end_trigger_tokens: 0
            incremental_batch_chars: 480000
            max_message_chars: 16000
            max_dialogue_chars: 1000000
            last_dialog_steps_count: 3
            last_dialog_step_message_max_chars: 4000
            max_accumulated_summary_chars: 20000
            intent_log_preview_chars: 10000
          quality_gate:
            max_dialogue_chars: 200000
            max_message_chars: 5000
          working_memory:
            max_chars_goal: 2000
            max_chars_constraints: 4000
            max_chars_state: 6000
            max_chars_knowledge: 8000
            total_budget_chars: 20000
          todo:
            reminder_steps: 10
          tool_usage_notice: []
          intent_scope:
            tools: {}
            max_summary_chars: 500
            max_tool_output_chars: 8000
            max_raw_record_chars: 5000
            max_final_answer_raw_chars: 2000
            fallback_raw_on_llm_error: true
          security:
            command_moderation:
              enabled: false
              mode: allow
              allowed_command_examples: []
              denied_command_examples: []
            write_guard:
              enabled: false
              mode: ask
              extra_paths: []
            read_guard:
              enabled: false
              mode: allow
              allowed_read_roots: []
              allowed_read_paths: []
              denied_read_paths: []
              denied_file_patterns: []
              denied_extensions: []
              max_file_size_kb: 1024
              binary_read_policy: ask
              binary_allowed_types:
                - application/pdf
                - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                - image/png
                - image/jpeg
              binary_allowed_extensions:
                - .pdf
                - .docx
                - .png
                - .jpg
                - .jpeg
            protected_paths:
              enabled: false
              extra: []
          fs_tools:
            max_read_bytes: 8388608
            max_mutate_bytes: 16777216
            find_in_files:
              max_file_bytes: 16777216
              max_candidates_like: 500000
              max_candidates_or_simple: 200000
              max_candidates_affix_or: 300000
              max_candidates_complex: 50000
              max_unfiltered_host_reads: 1000
              max_open_files_affix_or: 50000
              content_workers_threshold: 20000
              max_exclude_dirs: 32
              top_level_dirs_cap: 5
              default_limit: 100
              max_total_matches: 300
              exclude_dot_dirs: true
              exclude_dir_names: []
            find_files_by_name:
              default_max_matches: 100
              hard_max_matches: 300
              max_visited: 500000
          mcp:
            servers: {}
            meta:
              tools-cache-ttl: 3600
              request_timeout_sec: 600
              discovery_timeout_sec: 120
          pricing:
            enabled: false
            currency: "₽"
            per_tokens: 1000000
            input: null
            output: null
            cache_read: null
            models: {}
          logging:
            save_logs: false
            console_trace: false
            format: text
            log_level: info
            redact_secrets:
              enabled: false
              extra_keys: []
              extra_patterns: []
            full_log_backend: false
          strip_tags_projection:
            strip_think: false
            tags: []

uag_skills:
  harbor_job:
    agents:
      - <<: *uag
        skills:
          - __FLEET_TASK_SKILLS__
        kwargs:
          <<: *uag_kwargs
          gc_cli_config:
            <<: *uag_config
            agent:
              <<: *uag_settings
              stop_tools:
                - turn_ask_human
                - project_memory
                - fs_save_base64_file
                - exec_calculator
                - exec_sleep
                - exec_python
                - exec_fetch_url
                - turn_intermediate_reply
                - session_think
                - session_read_user_intent_log
                - session_compact
                - fs_view_image
                - download_file
