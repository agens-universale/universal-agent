# Секция процесса gc-chat. Это не полный конфиг агента.
#
# Скопируйте блок `chat_api:` в тот же config.yml, которым пользуетесь для
# gc-cli (бэкенд, модель, MCP). Запуск:
#
#   gc-chat --config ./config.yml
#
# Без секции процесс всё равно стартует: схема подставит значения ниже.
# Ключи читает только gc-chat. На этом порту оба пути:
# POST /v1/responses и POST /v1/chat/completions.
# gc-cli и TUI их не применяют.
#
# os_backend агента на этом процессе обязан быть local (это дефолт).
# harbor и любой другой бэкенд — выход с кодом 1 до открытия порта:
# рабочий каталог хода — путь на машине этого процесса.
#
# Подробности: docs/responses.md

chat_api:
  # Куда слушать. По умолчанию только loopback.
  host: "127.0.0.1"
  port: 8090
  # Страница чата открывается с этого порта: http://127.0.0.1:8090/

  # Пустая строка — заголовок Authorization не проверяется, на старте
  # строка в stderr: сервер без авторизации. Там же перечисляются ручки.
  # Непустая строка — каждый запрос к /v1/ несёт Authorization: Bearer <token>,
  # иначе 401.
  auth_token: ""

  # Пустой список — любой origin (Access-Control-Allow-Origin: *).
  # Непустой — только эти origin, методы GET, POST, OPTIONS, заголовок
  # Authorization. Запись "*" из списка выбрасывается.
  # Страница чата открывается с порта этого процесса и CORS не использует.
  # Заголовок нужен чужим клиентам. Preflight Chrome к loopback получает
  # Access-Control-Allow-Private-Network: true.
  cors_origins: []

  # Рабочий каталог нового хода, если в запросе нет абсолютного metadata.cwd.
  # null — берётся каталог процесса. Относительный путь не используется.
  launch_root: null

  # Проза без тула. deny | judge | allow. Дефолт канала — allow.
  # После загрузки фасад пишет это значение в runtime-ключ text_answer_mode.
  # То, что стояло в agent.* или в плоском text_answer_mode, на этом процессе
  # не действует.
  text_answer_mode: "allow"

  # Судья на turn_finish. "off" | "on" | "smart". Дефолт — "off".
  # Кавычки обязательны: YAML читает off и on как boolean.
  # strict_turn_finish_validation становится false, finish_gate_smart — false.
  # Значение agent.strict_turn_finish_validation фасад перекрывает.
  # on  — гард включён, smart выключен.
  # smart — гард включён и finish_gate_smart true.
  finish_gate_mode: "off"

  # Напоминания про session_todo. 0 — не напоминать. Сам тул не снимается.
  # Значение перекрывает todo.reminder_steps на этом процессе.
  todo_reminder_steps: 0

  # turn_ask_human и turn_intermediate_reply режим дописывает в stop_tools
  # сам. Вопрос пользователю и прогресс посреди хода —
  # проза ответа. Ролевая вставка режима подменяет special instructions.
