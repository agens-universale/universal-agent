[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-a2a"
version = "0.5.0"
description = "GigaCode Universal Agent — A2A-фасад (gc-a2a)"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
]

[project.scripts]
gc-a2a = "gc_a2a.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
