[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-cli"
version = "0.5.0"
description = "GigaCode Universal Agent — CLI-фронтенд (gc-cli)"
requires-python = ">=3.11"
dependencies = [

    "gc-core==0.5.0",
    "gc-mcp==0.5.0",

]

[project.scripts]

gc-cli = "gc_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_cli"]

[tool.pytest.ini_options]

testpaths = ["tests"]
asyncio_mode = "auto"
