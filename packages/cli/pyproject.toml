[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-cli"
version = "0.5.0"
description = "GigaCode Universal Agent — CLI-фронтенд (gc-cli)"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех манифестов обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-core==0.5.0",
    "gc-mcp==0.5.0",

]

# Команды объявляет КАЖДЫЙ профиль-приложение: uv tool install экспортирует в
# PATH скрипты только запрошенного дистрибутива. Точки входа фронтендов
# присутствуют всегда и без своего профиля печатают однострочную подсказку —
# охранники gc_core.tui_entry / gc_core.serve_entry.
[project.scripts]
# Только СВОЯ команда. Раньше профиль объявлял ещё gc-mcp/gc-mcp-install —
# и два профиля не ставились рядом: uv не перезаписывает чужой симлинк, а
# отказывает («Executables already exist»), а `uv tool uninstall` одного
# профиля уносил gc-mcp у другого. Команды MCP объявляет их владелец —
# дистрибутив gc-mcp, от которого этот профиль зависит жёстко.
gc-cli = "gc_core.cli_entry:main"


[tool.hatch.build.targets.wheel]
packages = ["src/gc_cli"]

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/cli && pytest` — доказательство,
# что пакет не тянет соседей. Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
