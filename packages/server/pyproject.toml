[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-server"
version = "0.4.0"
description = "GigaCode Universal Agent — серверные поверхности: webhook, swarm, chat, a2a (gc-serve)"
requires-python = ">=3.11"
dependencies = [

    "gc-core==0.4.0",

    "gc-cli==0.4.0",
    "gc-mcp==0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

[project.scripts]

gc-serve = "gc_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_server"]

[tool.pytest.ini_options]

testpaths = ["tests"]
asyncio_mode = "auto"
