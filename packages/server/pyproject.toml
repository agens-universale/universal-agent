[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-server"
version = "0.4.0"
description = "GigaCode Universal Agent — серверные поверхности: webhook, swarm, chat, a2a (gc-serve)"
requires-python = ">=3.11"
dependencies = [

    "gc-core==0.4.0",

    "gc-cli==0.4.0",
    "gc-mcp==0.4.0",
    "gc-stores==0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

[project.optional-dependencies]
# Драйверы хранилищ из storage: config.yml (gc-stores без них — только код).
postgres = ["gc-stores[postgres]==0.4.0"]
mysql = ["gc-stores[mysql]==0.4.0"]
redis = ["gc-stores[redis]==0.4.0"]
s3 = ["gc-stores[s3]==0.4.0"]
all = ["gc-stores[all]==0.4.0"]

[project.scripts]

gc-serve = "gc_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_server"]

[tool.pytest.ini_options]

testpaths = ["tests"]
asyncio_mode = "auto"
