[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-server"
version = "0.5.0"
description = "GigaCode Universal Agent — FastAPI-режим и swarm (gc-serve)"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех манифестов обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-core==0.5.0",
    "gc-mcp==0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "psutil>=5.9,<7",
]

# Команды объявляет КАЖДЫЙ профиль-приложение: uv tool install экспортирует в
# PATH скрипты только запрошенного дистрибутива. Точки входа фронтендов
# присутствуют всегда и без своего профиля печатают однострочную подсказку —
# охранники gc_core.tui_entry / gc_core.serve_entry.
[project.scripts]
# Профиль объявляет ТОЛЬКО свою команду. Раньше все четыре объявляли одни и
# те же пять имён, и оба установленных профиля дрались за одни симлинки в
# ~/.local/bin: второй перезаписывал первый, а `uv tool uninstall` одного
# сносил команды другого.
# gc-mcp/gc-mcp-install — исключение: точка входа в ядре (шим), а сам
# менеджер приезжает дистрибутивом gc-mcp, от которого зависят все профили.
# Поэтому пересечение симлинка безвредно — команда отработает одинаково.
gc-serve = "gc_core.serve_entry:main"
gc-mcp = "gc_core.mcp_entry:main"
gc-mcp-install = "gc_core.mcp_entry:install"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_server"]

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/server && pytest` — доказательство,
# что пакет не тянет соседей. Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
