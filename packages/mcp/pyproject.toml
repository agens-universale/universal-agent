[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-mcp"
# Версии ВСЕХ манифестов обязаны совпадать: профили пинят друг друга точно.
version = "0.5.0"
description = "GigaCode Universal Agent — менеджер MCP-серверов и курируемые рецепты"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.5.0",
    "pyyaml>=6.0.3",
]

# Команды объявляет тот дистрибутив, которому принадлежит код. Профили их НЕ
# дублируют: uv владеет симлинком эксклюзивно, поэтому два профиля с одним
# именем команды не ставятся рядом — второй падает с «Executables already
# exist». Проверено установкой.
[project.scripts]
gc-mcp = "recommended_mcp.runtime.cli:main"
gc-mcp-install = "recommended_mcp.runtime.install_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recommended_mcp"]

# Исходники MCP-серверов лежат рядом с рецептами и в репозитории, и в колесе:
# install.py резолвит install.source относительно каталога рецептов
# (`../external/vendor/<name>-mcp`), поэтому цель обязана повторять путь из
# манифеста. Иначе локальная установка тихо съедет в git-метод.
[tool.hatch.build.targets.wheel.force-include]
"../../external/vendor/ddgs-mcp" = "external/vendor/ddgs-mcp"

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/mcp && pytest` — доказательство,
# что дистрибутив не тянет соседей.
testpaths = ["tests"]
asyncio_mode = "auto"
