# Скопируй этот блок в секцию mcp-servers: твоего config.yml агента.
# См. README.md в этой папке — подробнее про транспорт, env-переменные, ограничения.
computer:
  transport: stream_stdio
  command: computer-mcp
  description: "Windows GUI control via UI Automation"
  server-name: computer
  env:
    COMPUTER_MCP_LOG_LEVEL: INFO
    COMPUTER_MCP_READONLY: "false"
    COMPUTER_MCP_ENABLE_VISION: "false"
    COMPUTER_MCP_SESSION_ID: "default"
