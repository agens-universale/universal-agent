[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "science-mcp"
version = "0.1.0"
description = "MCP server for unified scientific literature search across OpenAlex, CrossRef, PubMed/PMC, arXiv, Semantic Scholar, DBLP, CORE, OpenCitations, bioRxiv/medRxiv"
requires-python = ">=3.10"
dependencies = [

    "mcp[cli]>=1.26.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
science-mcp = "science_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["science_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
