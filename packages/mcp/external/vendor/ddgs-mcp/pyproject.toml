[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgs-mcp"

version = "0.2.0"
description = "MCP server for web/news search via DuckDuckGo (DDGS)"
requires-python = ">=3.10"
dependencies = [

    "mcp>=1.26.0,<2",
    "ddgs>=9.6.1",
]

[project.scripts]
ddgs-mcp = "ddgs_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ddgs_mcp*"]

[tool.pytest.ini_options]
