[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-tui"
version = "0.5.0"
description = "GigaCode Universal Agent — Textual-фронтенд (gc-ua)"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех манифестов обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-core==0.5.0",
    "gc-mcp==0.5.0",
    "textual>=0.55",
    "rich>=13",
    "pygments>=2.13",
]

# Команды объявляет КАЖДЫЙ профиль-приложение: uv tool install экспортирует в
# PATH скрипты только запрошенного дистрибутива. Точки входа фронтендов
# присутствуют всегда и без своего профиля печатают однострочную подсказку —
# охранники gc_core.tui_entry / gc_core.serve_entry.
[project.scripts]
# Профиль объявляет ТОЛЬКО свою команду. Раньше все четыре объявляли одни и
# те же пять имён, и оба установленных профиля дрались за одни симлинки в
# ~/.local/bin: второй перезаписывал первый, а `uv tool uninstall` одного
# сносил команды другого.
# gc-mcp/gc-mcp-install ведут ПРЯМО в дистрибутив gc-mcp, от которого профиль
# зависит жёстко. Объявлять их всё равно приходится здесь: uv tool кладёт в
# PATH скрипты только ЗАПРОШЕННОГО дистрибутива, поэтому объявление в
# манифесте gc-mcp команду бы не дало (проверено установкой).
# Пересечение симлинка безвредно — цель у всех профилей одна и та же.
gc-ua = "gc_core.tui_entry:main"
gc-mcp = "recommended_mcp.runtime.cli:main"
gc-mcp-install = "recommended_mcp.runtime.install_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_tui"]

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/tui && pytest` — доказательство,
# что пакет не тянет соседей. Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
