[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-tui"
version = "0.3.0"
description = "GigaCode Universal Agent — Textual-фронтенд (gc-ua)"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех манифестов обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-core==0.3.0",
    "gc-mcp==0.3.0",
    "textual>=0.55",
    "rich>=13",
    "pygments>=2.13",
    # Голосовой ввод: код (gc_tui.voice, gc_tui.voice_runtime) и его зависимости
    # живут в одном дистрибутиве. До 27.08.2026 код лежал в ядре, а зависимости
    # здесь — шов остался от вливания develop и снят вместе с переездом. Ядру голос
    # не нужен ни строкой: уведомления о нём собирает gc_tui.services.voice_notices
    # и передаёт в collect_startup_notices параметром. Поэтому headless-профиль
    # gc-server не тянет за собой PortAudio и веса моделей.
    "sounddevice>=0.4",
    "truststore>=0.9",
    "huggingface_hub>=0.30",
    # requests здесь нет намеренно: голос ходит в сеть клиентом ядра, а ядро на
    # httpx. Он приезжал транзитом из gc-core, а после переезда ядра был на день
    # объявлен здесь — пока не выяснилось, что в коде голоса от него остались
    # только `except`-ветки, которые уже не могли совпасть. Сторож —
    # tests/test_voice_dependencies_declared.py.
]

# Команды объявляет КАЖДЫЙ профиль-приложение: uv tool install экспортирует в
# PATH скрипты только запрошенного дистрибутива. Команда целится прямо в свой
# пакет: шимы-охранники в ядре сняты 27.08.2026 — после разведения имён команд
# «команда есть, а пакета нет» в здоровой установке не бывает.
[project.scripts]
# Только СВОЯ команда. Раньше профиль объявлял ещё gc-mcp/gc-mcp-install —
# и два профиля не ставились рядом: uv не перезаписывает чужой симлинк, а
# отказывает («Executables already exist»), а `uv tool uninstall` одного
# профиля уносил gc-mcp у другого. Команды MCP объявляет их владелец —
# дистрибутив gc-mcp, от которого этот профиль зависит жёстко.
gc-ua = "gc_tui:main"
# Голосовая батарейка — команда профиля TUI: единственного, где голос включён.
gc-voice = "gc_tui.voice_runtime.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/gc_tui"]

[tool.pytest.ini_options]
# Набор пакета гоняется отдельно: `cd packages/tui && pytest`. Зелёный
# автономный прогон изоляции НЕ доказывает: плагин тест-кита кладёт на
# sys.path все шесть packages/*/src при любом нашем rootdir, поэтому чужой
# импорт спокойно резолвится. Изоляцию доказывает статический сторож
# tests/test_test_ownership.py — он смотрит на текст импортов.
# Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
# Гейт на брошенные корутины — такой же, как у ядра, и по той же причине.
#
# Без него долг жил незамеченным: когда обработчики экрана стали корутинами,
# тесты продолжали звать их как функции, и падал АССЕРТ («экран не
# переключился», «трасса пуста»), а не предупреждение о брошенной корутине.
# Тридцать восемь тестов указывали куда угодно, кроме настоящей причины.
#
# Нужны ОБА фильтра: `RuntimeWarning` ловит корутину, освобождённую по
# счётчику ссылок внутри теста, а Unraisable — ту, которую добрал сборщик
# мусора уже после него. Подробности — в pyproject ядра.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
    # Исключение ровно на ОДНУ внутреннюю корутину Textual, и не для удобства.
    #
    # `App.call_from_thread` заводит `run_callback` и ставит его на loop
    # приложения. Когда `pilot` сносит приложение, а колбэк из чужого потока
    # ещё не доехал, корутина остаётся нежданой — гонка фреймворка на
    # teardown, не наш код. Без этой строки гейт краснеет на ней в полном
    # прогоне (и каждый раз на другом тесте), а мигающий гейт учат
    # игнорировать — то есть он перестаёт ловить то, ради чего поставлен.
    # Наши корутины под исключение не попадают: фильтр привязан к имени.
    "default:coroutine 'App.call_from_thread.<locals>.run_callback' was never awaited:RuntimeWarning",
]
