[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-tui"
version = "0.5.0"
description = "GigaCode Universal Agent — Textual-фронтенд (gc-ua)"
requires-python = ">=3.11"
dependencies = [
    # Точный пин: версии всех манифестов обязаны совпадать, иначе можно собрать
    # установку из разных коммитов.
    "gc-core==0.5.0",
    "gc-mcp==0.5.0",
    "textual>=0.55",
    "rich>=13",
    "pygments>=2.13",
    # Голосовой ввод. Живёт в ядре (gc_core.voice / gc_core.voice_runtime),
    # но включается ТОЛЬКО в TUI: startup_notices._voice() выходит на
    # `if not is_tui: return []`, а диктовку зовёт gc_tui.screens.main. Все три
    # импортируются лениво, поэтому в ядре они не нужны — и headless-профиль
    # gc-server не тянет за собой PortAudio и веса моделей.
    "sounddevice>=0.4",
    "truststore>=0.9",
    "huggingface_hub>=0.30",
]

# Команды объявляет КАЖДЫЙ профиль-приложение: uv tool install экспортирует в
# PATH скрипты только запрошенного дистрибутива. Точки входа фронтендов
# присутствуют всегда и без своего профиля печатают однострочную подсказку —
# охранники gc_core.tui_entry / gc_core.serve_entry.
[project.scripts]
# Только СВОЯ команда. Раньше профиль объявлял ещё gc-mcp/gc-mcp-install —
# и два профиля не ставились рядом: uv не перезаписывает чужой симлинк, а
# отказывает («Executables already exist»), а `uv tool uninstall` одного
# профиля уносил gc-mcp у другого. Команды MCP объявляет их владелец —
# дистрибутив gc-mcp, от которого этот профиль зависит жёстко.
gc-ua = "gc_core.tui_entry:main"
# Голосовая батарейка — команда профиля TUI: единственного, где голос включён.
gc-voice = "gc_core.voice_runtime.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/gc_tui"]

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/tui && pytest` — доказательство,
# что пакет не тянет соседей. Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
