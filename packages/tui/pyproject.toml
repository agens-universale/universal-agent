[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-tui"
version = "0.5.0"
description = "GigaCode Universal Agent — Textual-фронтенд (gc-ua)"
requires-python = ">=3.11"
dependencies = [

    "gc-core==0.5.0",
    "gc-mcp==0.5.0",
    "textual>=0.55",
    "rich>=13",
    "pygments>=2.13",

    "sounddevice>=0.4",
    "truststore>=0.9",
    "huggingface_hub>=0.30",

    "httpx>=0.27",
    # PIL.ImageGrab — картинка из буфера обмена Windows (os_ops, импорт ленивый).
    # Пакет импортирует его своим именем — объявлен здесь: транзит из gc-core не гарантия.
    "pillow>=10.3",
]

[project.scripts]

gc-ua = "gc_tui:main"

gc-voice = "gc_tui.voice_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_tui"]

[tool.pytest.ini_options]

testpaths = ["tests"]
asyncio_mode = "auto"

filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",

    "default:coroutine 'App.call_from_thread.<locals>.run_callback' was never awaited:RuntimeWarning",
]
