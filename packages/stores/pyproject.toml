[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-stores"
version = "0.4.0"
description = "GigaCode Universal Agent — хранилища тредов на базах (Postgres)"
requires-python = ">=3.11"
dependencies = ["gc-core==0.4.0"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/gc_stores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
