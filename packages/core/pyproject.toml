[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-core"
version = "0.5.0"
description = "GigaCode Universal Agent — ядро агента (SDK): цикл, тулы, конфиг, безопасность, память, MCP-клиент"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "requests[socks]",
    "trafilatura",
    "readability-lxml",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "httpx-sse>=0.4.0",
    "mcp==1.26.0",
    "chardet>=7.4.3",
]

# [project.scripts] здесь НЕТ и быть не должно: gc-core — библиотека. Команды
# объявляют профили-приложения (cli/tui/server и мета), см. docs/packaging.md.

[tool.hatch.build.targets.wheel]
packages = ["src/gc_core"]

# Ассеты кладутся РЯДОМ с пакетом, в корень site-packages: bundled_root()
# ищет prompts/ у себя и на уровень выше (gc_core/ -> site-packages/).
[tool.hatch.build.targets.wheel.force-include]
"assets/prompts" = "prompts"
"assets/skills" = "skills"
"assets/config.default.yml" = "config.default.yml"
"../../recommended_mcp" = "recommended_mcp"
"../../external/ddgs-mcp" = "external/ddgs-mcp"

[tool.pytest.ini_options]
# Набор пакета самодостаточен: `cd packages/core && pytest` — доказательство,
# что пакет не тянет соседей. Общая инфраструктура приезжает из gc-testkit.
testpaths = ["tests"]
asyncio_mode = "auto"
