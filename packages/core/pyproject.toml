[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-core"
version = "0.4.0"
description = "GigaCode Universal Agent — ядро агента (SDK): цикл, тулы, конфиг, безопасность, память, MCP-клиент"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "trafilatura",
    "readability-lxml",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "httpx-sse>=0.4.0",

    "certifi",
    "mcp==1.26.0",
    "chardet>=7.4.3",
    # Изображения во вводе (`gc_core.attachments.normalize`): разбор, поворот по
    # EXIF, ужатие, перекодирование. Импорт ленивый — только внутри функций
    # нормализации, старт ядра за C-расширение не платит (сторож —
    # tests/attachments/test_attachments_import_light.py). Граница 10.3: всё
    # используемое API там уже есть, и закрыта CVE-2024-28219.
    "pillow>=10.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gc_core"]

[tool.hatch.build.targets.wheel.force-include]
"assets/prompts" = "gc_core/assets/prompts"
"assets/skills" = "gc_core/assets/skills"
"assets/config.default.yml" = "gc_core/assets/config.default.yml"

[tool.pytest.ini_options]

testpaths = ["tests"]
asyncio_mode = "auto"

filterwarnings = [

    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
]
