# =============================================================================
# Дефолт-конфиг GigaCode Universal Agent (gc-ua).
# Авто-копируется в пользовательский config.yml при первом запуске
# (Windows: ~/.gc/, macOS/Linux: ~/.config/gc/).
# Полный документированный пример со всеми опциями — demo_config.yml.
#
# ПЕРЕД ПЕРВЫМ ЗАПРОСОМ впишите:
#   1) backend.completions_url — endpoint OpenAI-совместимого провайдера;
#   2) backend.chat_completion_headers.Authorization — токен доступа.
# =============================================================================

# Профили и уровни моделей: указатели на активный профиль/уровень. "" = профиль не выбран.
# Секции models/slots/assign (реестр моделей, уровни, привязки) — опциональны.
profile: ""
level: default               # light | default | max

# Хотите уровни моделей (light/default/max) и привязки потребителей к ним —
# раскомментируйте и заполните под свои модели (полный референс — demo_profile.yml,
# симметричный пример как обычных секций config.yml — demo_config.yml):
# models:
#   glm-local:
#     url: http://127.0.0.1:8014/v1/chat/completions
#     token: ""                # адрес и токен задаются вместе; "" = «без авторизации»
# slots:
#   default: glm-local
# assign:
#   finish_gate: light

backend:
  api_mode: chat_completions
  # Впишите endpoint (OpenAI-совместимый chat/completions), напр.:
  #   https://routerai.ru/api/v1/chat/completions  (тогда use_ssl: true)
  completions_url: "http://your-backend:PORT/v1/chat/completions"
  chat_completions_max_tokens: 8096
  use_ssl: false
  use_max_tokens_param: true
  # true — провайдер требует OpenAI strict tools (все properties в required).
  # false — типично для GigaCode и non-OpenAI; при true локальная валидация всё равно
  # принимает omit semantic optional (x-optional-keys).
  openai_strict_tools_schema: false
  # Слать ли провайдеру поле function.strict в схемах тулов.
  # false — если сборка провайдера (vllm/sglang) отвечает на это поле 500.
  send_tool_strict: true
  # Разметка prompt cache для claude-моделей в главном цикле: не задано — авто по id
  # модели; true — включить всем; false — выключить (аварийный рычаг, если прокси
  # отвергает разметку; можно на одну модель: models.<alias>.backend).
  # claude_prompt_cache: false
  use_retry: true
  # HTTP-таймаут одного запроса к LLM (секунды). Дефолт 600 (10 минут).
  request_timeout_sec: 600
  # HTTP/SOCKS-прокси для backend-вызовов. null/пусто → из env
  # (HTTPS_PROXY/HTTP_PROXY/ALL_PROXY). Пример: "socks5h://proxy.example:1080"
  proxy: null
  # Vendor-параметры тела запроса (сэмплинг, диалект thinking). Агент
  # поставляется без предзаданных схем: null — секция не задана, в запрос
  # уходят серверные дефолты модели. Не {}: на алиасе «секции нет» и «слать
  # пусто» — разные вещи. Диалект стека собирается в профиле (demo_profile.yml).
  chat_completion_kwargs: null
  chat_completion_headers:
    Authorization: "Bearer <ВПИШИТЕ_ТОКЕН>"
    # Можно не хранить токен в файле:
    #   Authorization: "Bearer ${ENV:GC_API_KEY}"                # затем: export GC_API_KEY=sk-...
    # Или из файла (chmod 600): Authorization: "Bearer ${FILE:~/.secrets/gc_api_key}"

agent:
  model: "<ВПИШИТЕ_МОДЕЛЬ>"
  system_prompt_id: v1
  use_server_subagents: false
  use_local_subagents: true
  subagent_max_steps: 500
  client_name: gc_ua_agent
  x_cl_id: "12345"
  verbose: true
  stop_tools: []
  server_tool_prefix: system
  max_steps: 1000
  # Per-run лимиты надёжности (закомментировано = выключено):
  # session_token_limit: 200000   # бюджет input+output токенов на один ран
  # max_tool_calls: 100           # макс. вызовов инструментов на один ран
  # Аварийная LLM-суммаризация трейса при лимите (step/tool/token limit).
  # Возвращает envelope с raw_trace_summary; false — пустой summary.
  limit_trace_summary: true
  loop_detector:
    enabled: true
  no_tool_call_max_count: 3
  strict_turn_finish_validation: true
  # Потолок RAM-буфера stdout/stderr на поток (decoded UTF-8 chars) для exec:
  # L = голова floor(L/2) + настоящий хвост (L - floor(L/2)); середина отбрасывается.
  exec_output_capture_max_chars: 40000
  # Каждый край front-loaded preview длинного потока (P ≤ L - floor(L/2)); 0 — без preview.
  exec_output_preview_edge_chars: 3000
  # Имя HTTP-заголовка для внешнего trace_id (флаг gc-cli --trace-id или поле
  # trace_id в теле вебхука). Не задано — заголовок к модели называется
  # x_trace_id, заголовок к MCP-серверам — trace_id.
  # Задайте X-Trace-Id, если между агентом и бэкендом стоит nginx: он по
  # умолчанию выбрасывает заголовки с подчёркиванием (underscores_in_headers off).
  # trace_id_header_name: X-Trace-Id
  # Папка с файлами-определениями кастомных сабагентов (.md с YAML-frontmatter).
  # Не задана — доступны только встроенные. См. docs/subagents.md.
  # subagents_dir: ./agents
  # subagents_max_count: 20

# TUI: что рендерить во время стриминга (действует только при backend.stream: true;
# на счётчик токенов и индикатор не влияет — только контент).
tui:
  # Мастер-свитч live-стриминга в TUI (chat_completions). На CLI/server/swarm НЕ
  # влияет — там всегда non-stream (гейтится on_stream_delta, ставит только TUI).
  # Не задан → legacy backend.stream.
  stream: true
  # minimal (default) — только индикатор + счётчик; answer — прогрессивный ответ;
  # answer_reasoning — + строка-мысль «⠇ …».
  stream_display: minimal
  # adaptive bounce (только TUI): как поступать с текст-ответом без тула.
  #   deny  — всегда требовать tool-call (как CLI/server/swarm);
  #   judge — судья решает, полный ли это ответ (привет/объяснение → принять);
  #   allow — всегда принимать текст (ни bounce, ни судьи).
  text_answer_mode: judge
  finish_gate_mode: "smart"        # /gate: on — судья всегда; smart — судья только при вызовах инструментов; off — отключить (только TUI)
  # Только TUI: оставить лишь корневой AGENTS.md (L3), отбросив global (~/.config/gc)
  # и .gc/AGENTS.md. Игнорируется, если задан paths.agent_md_path (путь главнее).
  agentsmd_override: false
  # Bang-shell: префикс `!` в поле ввода → локальная shell-команда (не агент).
  bang_shell:
    enabled: true
    # null / omit / 0 = без лимита. Положительное N = авто-kill через N секунд.
    # timeout_sec: null
    max_output_bytes: 32768
    max_output_lines: 200
  file_view:
    enabled: true
    max_file_bytes: 67108864   # 64 MiB
    # null / omit = авто по высоте экрана; число = фиксированный шаг PgUp/PgDn.
    # page_lines: null

# Канал IDE через Agent Client Protocol (gc-acp). Не влияет на TUI/CLI/server:
# канальные дефолты копируются в runtime в apply_acp_runtime_defaults.
acp:
  # deny | judge | allow — в IDE по умолчанию allow (обсуждение без tool-call нормально)
  text_answer_mode: allow
  # on | off | smart — в IDE обычно off (человек сам сверяет ответ). "off" в кавычках!
  finish_gate_mode: "off"
  # Каждые N шагов без session_todo — technical reminder. 0 = выкл (дефолт IDE).
  todo_reminder_steps: 0

# Правки агента: запись в журнал и показ на экране /diff (не параметры fs return_diff).
agent_edits:
  snapshots_max_files: 500     # лимит снимков «до правки» в .gc/agent_edits (LRU; треды с живым журналом не вытесняются)
  max_diff_chars: 100000       # усечение больших диффов (0 = без лимита)
  hunk_context_lines: 3        # строк контекста в хэнках журнальных диффов
  max_diff_source_bytes: 2000000  # порог размера файла: свыше — дифф не считается, снапшот не снимается
  shell_tracking: true         # трекинг правок, сделанных shell-командами
  trace_inline_max_lines: 30   # ЭКРАННЫХ рядов диффа в ленте до свёртки
  replay_expanded_turns: 20    # сколько последних ходов разворачивать при открытии треда (0 — все)
  turn_summary_in_status: true # сводка правок в статусной строке хода
  # Где вести журнал правок (дифф в ленте, сводка хода, экран /diff) — по режиму запуска.
  # tui: false выключает все три; в gc-cli и на сервере журнал по умолчанию не пишется.
  record:
    tui: true
    cli: false
    server: false

# Обновление агента (спека D)
update:
  check: auto            # auto | off — фоновая проверка новой версии при старте TUI
  extra_args: []         # доп. аргументы к uv tool install (корп-сеть: ["--system-certs"])

logging:
  full_log_backend: false
  console_trace: true
  save_logs: true
  format: text                 # text — человекочитаемо; jsonl — структурный поток событий
  log_level: info              # debug | info | warning | error
  # Всплывать ли записям рана в корневой логгер приложения.
  # false (дефолт) — ран пишет в свой файл и не засоряет чужие хендлеры.
  # true нужен встраивающему, который настроил logging по-своему: без него он
  # не увидит ничего, потому что per-run логгер обрывает цепочку.
  propagate: false

paths:
  # Промпт роли запуска (agent_md). Пусто = ролевого промпта нет.
  # В CLI/server/swarm это единственный источник инструкций; задан → замещает всё.
  agent_md_path: ""

summary:
  # ~67–80k токенов истории — рассчитано на контекст моделей ~131k (под меньшие
  # модели снижай; под 262k — поднимай ~2× до ~360–400k). batch (×1.4) и
  # turn-end-trigger (×0.6) выводятся отсюда.
  chat_completions_summary_trigger_chars: 200000
  # 0 — токенный порог выключен. Положительное значение сравнивает input-токены
  # последнего главного запроса. Ключа turn-end нет: 60% от этого порога,
  # явный 0 это плечо выключает. Дополнение к символьному, не замена: в число
  # входят системный промпт и схемы тулов, порог держать заметно выше них.
  # Символьный выключен — batch выводится отсюда (×2 символа на токен, ×1.4).
  chat_completions_summary_trigger_tokens: 0
  max_message_chars: 50000
  max_dialogue_chars: 1000000
  max_accumulated_summary_chars: 20000
  last_dialog_steps_count: 5
  last_dialog_step_message_max_chars: 1500

# Вспомогательные LLM (summary, finish gate, intent scope, judges).
chat_completions:
  auxiliary_llm:
    # Служебный вызов, когда у алиаса нет своей секции auxiliary.
    # null — секция не задана: серверные дефолты модели, без vendor-ключей.
    # Диалект (enable_thinking и соседние) — в профиле, per-алиас.
    # Не {}: явный пустой словарь на алиасе значит «не слать этих ключей».
    completion_kwargs: null

# tags — какие ещё теги вырезать из саммари, intent, digest и т.п. (не из истории).
# Кодовый дефолт (ключа нет) — strip_think: false: копировать скрытое поле мысли.
# В этом шаблоне true: мысль в историю не копируется. Копирование даёт 400
# у DeepSeek и части strict-бэкендов; кому нужно поле в следующем запросе —
# ставят false явно. Salvage <think> при true — только если кроме ризонинга
# ничего нет (нет прозы и нет тулов). Смешанный ход — в историю только проза.
# Из саммари, intent, судей и памяти <think> вырезается всегда.
# В бэкенд уходит то, что лежит в истории. Остальной state — без мыслей всегда.
strip_tags_projection:
  strip_think: true
  tags: []

intent_scope:
  # Финальная проза, закрывающая ход, пишется в intent log:
  # <= порога — как есть (raw); > порога — LLM-саммари (кап max_summary_chars).
  max_final_answer_raw_chars: 2000

# Лимиты FS-тулов, которые поднимают файл целиком в память.
# read — fs_read_file; mutate — apply/replace (не append).
fs_tools:
  max_read_bytes: 8388608       # 8 MiB
  max_mutate_bytes: 16777216    # 16 MiB (peak RAM ≈ ×2–3; raise via config if needed)
  # fs_find_in_files — search text inside files (path = file or directory).
  # max_file_bytes is a UNIFIED cap (file & directory mode); not read/mutate limits.
  # Candidate caps are per pattern_mode (scan automaton); over L(mode) → refuse.
  find_in_files:
    max_file_bytes: 16777216          # 16 MiB — single cap for file & dir mode
    max_candidates_like: 500000       # like / query_mode=text
    max_candidates_or_simple: 200000  # pure a|b|…
    max_candidates_affix_or: 300000   # one (group) + pure prefix/suffix
    max_candidates_complex: 50000     # no cheap prefilter
    max_unfiltered_host_reads: 1000   # sandbox only: host reads without in-sandbox prefilter
    max_open_files_affix_or: 50000    # full-re opens budget (affix_or only)
    content_workers_threshold: 20000  # N >= → 2 workers; else 1
    max_exclude_dirs: 32
    top_level_dirs_cap: 5
    default_limit: 100                # limit if caller omits it
    max_total_matches: 300            # hard ceiling: limit_eff = min(requested, 300)
    exclude_dot_dirs: true            # nested '.' dirs (hard floor always on)
    # Extra basenames only; hard floor always includes venv, __pycache__,
    # node_modules, .git (clearing this list does not re-open them).
    exclude_dir_names: []

  # fs_find_files_by_name — search files by name/path/glob under a directory.
  # Matches names and paths only; does NOT search file contents.
  find_files_by_name:
    default_max_matches: 100          # max_matches if caller omits it
    hard_max_matches: 300             # hard ceiling: max_matches_eff = min(requested, 300)
    max_visited: 500000               # walk safety cap (not a caller argument)

# Чек-лист задачи (session_todo): каждые reminder_steps шагов без вызова тула —
# напоминание. Есть незакрытые пункты — директивное «обнови список»; активного
# плана нет (пусто ИЛИ всё закрыто) — мягкое «если задача того стоит, заведи»,
# один раз за прогон. Счётчик переживает границу хода. 0 — политика выключена
# целиком (тул остаётся, вся инициатива на модели).
todo:
  reminder_steps: 10

security:
  command_moderation:
    enabled: true
    mode: ask
    allowed_command_examples: []
    denied_command_examples: []
  write_guard:
    enabled: true
    mode: ask
    extra_paths: []
  url_policy:
    enabled: true
    mode: ask
    allowed_schemes: ["http", "https"]
    # Blacklist хостов / URL-паттернов.
    # Матчинг: fnmatch по host и по полному URL (case-insensitive);
    # "*.suffix" матчит любой ПОДДОМЕН (apex без поддомена не матчится).
    # Примеры правил:
    #   "host"           — точный хост;
    #   "*.suffix"       — любой поддомен suffix;
    #   "10.*"           — fnmatch wildcard;
    #   "172.1[6-9].*"   — fnmatch character class.
    # SSRF-blacklist: cloud metadata, loopback/link-local, RFC1918.
    # Расширить — .gc/config.yml (merge добавляет, не сбрасывает).
    url_blacklist:
      # --- Cloud metadata endpoints ---
      - "169.254.169.254"            # AWS / GCP / OpenStack IMDS
      - "metadata.google.internal"   # GCP metadata (apex)
      - "*.metadata.google.internal" # GCP metadata (поддомены)
      - "metadata.azure.com"         # Azure metadata (apex)
      - "*.metadata.azure.com"       # Azure metadata (поддомены)
      # --- Loopback / link-local ---
      - "localhost"
      - "127.*"                      # весь loopback-блок 127.0.0.0/8
      - "::1"                        # IPv6 loopback
      - "0.0.0.0"
      - "169.254.*"                  # link-local (включая IMDS-подсеть)
      # --- RFC1918 private networks ---
      - "10.*"                       # 10.0.0.0/8
      - "192.168.*"                  # 192.168.0.0/16
      - "172.1[6-9].*"               # 172.16-19 (часть 172.16.0.0/12)
      - "172.2[0-9].*"               # 172.20-29
      - "172.3[0-1].*"               # 172.30-31
  read_guard:
    enabled: true
    mode: ask
    allowed_read_roots: []
    allowed_read_paths:
      - "~/.local/share/gc/skills"
      - "<launch_root>/.gc/skills"
    denied_read_paths:
      - "~/.ssh"
      - "~/.aws"
      - "~/.config/gcloud"
      - "~/.gnupg"
      - "/etc/ssl/private"
      - "/proc"
      - "/sys"
      - "~/.local/state/gc"
      - "<launch_root>/.gc"
    denied_file_patterns:
      - ".env"
      - ".env.*"
      - "*id_rsa*"
      - "*id_ed25519*"
      - "*.pem"
      - "*credentials*.json"
      - "*.sqlite"
    denied_extensions:
      - ".key"
      - ".pfx"
      - ".jks"
  protected_paths:
    enabled: true
    extra: []

# Подсчёт токенов и стоимости прогона. Токены считаются всегда; цена показывается
# только при enabled: true и наличии ЛЮБОЙ цены — фактической от провайдера или
# расчётной по тарифу (input/output ниже).
# Верхнеуровневые input/output — дефолтный тариф под agent.model (имя модели не нужно).
# models: — переопределение под конкретные модели (мультимодельные сетапы).
pricing:
  enabled: true
  currency: "₽"
  per_tokens: 1000000          # ставки указаны за столько токенов
  # Ставки нужны только провайдерам, которые не сообщают стоимость сами.
  # OpenRouter и routerai.ru присылают фактическую цену в каждом ответе — тогда
  # эта секция не используется. Валюта такой цены определяется по адресу вызова
  # (домен .ru — рубли, остальное — доллары) и запоминается вместе с суммой:
  # смена провайдера посреди диалога не переразмечает уже потраченное.
  input: 0                     # 0 в обеих ставках = «не задано»
  output: 0
  # cache_read: 0              # опц.; нет → кэш биллится как input

# Пресеты выпадающего списка в полях «Адрес API-сервера» (можно дополнять своими).
# Пресеты адресов провайдеров — выпадающий список под полем «Адрес API-сервера».
# Закомментировано намеренно: пока ключа тут нет, работает список из кода, и он
# обновляется вместе с версией агента. Раскомментируете — ваш список перекроет
# кодовый и с обновлениями меняться уже не будет.
# endpoint_presets:
#   - name: OpenRouter
#     url: https://openrouter.ai/api/v1/chat/completions
#   - name: Cloud.ru
#     url: https://foundation-models.api.cloud.ru/v1/chat/completions
#   - name: RouterAI
#     url: https://routerai.ru/api/v1/chat/completions

# Пресеты выпадающего списка в поле «URL» голосового ввода (можно дополнять своими).
# Закомментировано намеренно — по той же причине, что и `endpoint_presets` выше:
# пока ключа тут нет, работает список из кода и обновляется вместе с версией агента.
# Раскомментируете — ваш список перекроет кодовый и с обновлениями меняться уже не будет.
# voice_endpoint_presets:
#   - name: OpenAI
#     url: https://api.openai.com/v1/audio/transcriptions
#   - name: Groq
#     url: https://api.groq.com/openai/v1/audio/transcriptions
#   - name: Mistral
#     url: https://api.mistral.ai/v1/audio/transcriptions

# -----------------------------------------------------------------------------
# Сборка мусора (gc.collect) — точки C1/C2/C3.
# C1 (после компакции истории) и C2 (после close_all в finally) — всегда вкл.
# C3 (один collect после батча тулов, перед LLM-шагом) — управляется этим флагом.
# Default: on для CLI/TUI, off для server (gc.collect глобален для процесса).
# Явное значение перекрывает режимный default.
# gc:
#   force_collect: false

# Голосовой ввод в TUI (Ctrl+T). Зависимости ставятся вместе с агентом
# (Linux дополнительно: системный libportaudio2).
# Подходит любой /v1/audio/transcriptions-совместимый сервис.
# Локальный приватный сервис одной командой: gc-voice install (см. инструкцию).
# voice:
#   provider: openai
#   url: https://stt.example.com/v1/audio/transcriptions
#   token: "sk-..."
#   model: whisper-1
#   language: ru
#   max_seconds: 120
#   timeout_seconds: 60
#   verify-ssl: true
