[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-chat"
version = "0.3.1"
description = "GigaCode Universal Agent — HTTP-фасады Responses и Chat Completions (gc-chat)"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.3.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
]

[project.scripts]
gc-chat = "gc_chat.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_chat"]

[tool.hatch.build.targets.wheel.force-include]
"src/gc_chat/chat_page.html" = "gc_chat/chat_page.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
