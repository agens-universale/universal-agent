[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-responses"
version = "0.3.1"
description = "GigaCode Universal Agent — HTTP-фасад Responses (gc-responses)"
requires-python = ">=3.11"
dependencies = [
    "gc-core==0.3.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
]

[project.scripts]
gc-responses = "gc_responses.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_responses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
