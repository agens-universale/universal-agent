# Шаблон конфига LiteLLM Proxy.
#
# Скопируйте в proxy_config.yaml (он gitignored) и заполните реальные
# значения для GigaChat и Yandex Cloud:
#
#   cp litellm/proxy_config.example.yaml litellm/proxy_config.yaml
#   $EDITOR litellm/proxy_config.yaml
#
# proxy_config.yaml НЕ в git — credentials живут только локально.
#
# Эндпоинт прокси: http://localhost:4000/v1/chat/completions

model_list:
  - model_name: gigachat-2-lite
    litellm_params:
      model: gigachat/GigaChat-2
      api_key: "<BASE64(client_id:client_secret) from developers.sber.ru>"
      ssl_verify: false

  - model_name: gigachat-2-pro
    litellm_params:
      model: gigachat/GigaChat-2-Pro
      api_key: "<BASE64(client_id:client_secret) from developers.sber.ru>"
      ssl_verify: false

  - model_name: gigachat-2-max
    litellm_params:
      model: gigachat/GigaChat-2-Max
      api_key: "<BASE64(client_id:client_secret) from developers.sber.ru>"
      ssl_verify: false

  - model_name: yandex-gpt-lite
    litellm_params:
      model: "openai/gpt://<YANDEX_FOLDER_ID>/yandexgpt-lite/latest"
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: "<YANDEX_API_KEY from console.cloud.yandex.ru>"

  - model_name: yandex-gpt-pro
    litellm_params:
      model: "openai/gpt://<YANDEX_FOLDER_ID>/yandexgpt/latest"
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: "<YANDEX_API_KEY from console.cloud.yandex.ru>"

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 600
  telemetry: false
  callbacks: callbacks.provider_normalizer.proxy_handler_instance

general_settings:
  master_key: sk-litellm-test-master-1234
