# Конфиг LiteLLM Proxy — алиасы GigaChat-2 и YandexGPT за единым
# OpenAI-совместимым эндпоинтом на http://localhost:4000/v1/chat/completions.
# Placeholder'ы вида __VAR__ подставляются из litellm/.env при запуске
# через litellm/run.py (см. README).

model_list:
  - model_name: gigachat-2-lite
    litellm_params:
      model: gigachat/GigaChat-2
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

  - model_name: gigachat-2-pro
    litellm_params:
      model: gigachat/GigaChat-2-Pro
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

  - model_name: gigachat-2-max
    litellm_params:
      model: gigachat/GigaChat-2-Max
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

  - model_name: yandex-gpt-lite
    litellm_params:
      model: openai/gpt://__YANDEX_FOLDER_ID__/yandexgpt-lite/latest
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: os.environ/YANDEX_API_KEY

  - model_name: yandex-gpt-pro
    litellm_params:
      model: openai/gpt://__YANDEX_FOLDER_ID__/yandexgpt/latest
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: os.environ/YANDEX_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 600
  telemetry: false
  callbacks: callbacks.provider_normalizer.proxy_handler_instance

general_settings:
  master_key: sk-litellm-test-master-1234
