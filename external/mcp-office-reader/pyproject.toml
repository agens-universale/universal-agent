[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-office-reader"
version = "0.3.0"
description = "MCP server for reading and writing office documents (pdf, docx, xls, xlsx, pptx, csv, html, msg) with xlsx analytics"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26.0",
    "markitdown[pdf,docx,xlsx,xls,pptx]>=0.0.1",
    "uvicorn[standard]>=0.30.0",
    "python-json-logger>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "reportlab>=4.0.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
mcp-office-reader = "mcp_office_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_office_reader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
