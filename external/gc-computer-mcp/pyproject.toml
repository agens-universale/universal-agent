[project]
name = "gc-computer-mcp"
version = "0.1.0"
description = "MCP server for Windows GUI automation via UI Automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry Kargin" }]

dependencies = [
    "mcp==1.26.0",
    "uiautomation>=2.0.20",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "python-json-logger>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
gc-computer-mcp = "gc_computer_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gc_computer_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: requires Windows OS with real UIA",
    "manual: manual test, run on dev machine before release",
    "slow: test takes >5s",
]
