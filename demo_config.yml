# ---------------------------------------------------------------------------
# Это глобальный config.yml для gc-cli.
#
# Дополнительно к нему gc-cli читает project local config из <cwd>/.gc/config.yml
# (если файл существует) и мерджит его поверх через layered loading:
#   - scalar:  project переопределяет global
#   - dict:    рекурсивный deep merge
#   - list:    конкатенация + dedup (project расширяет, не сбрасывает security-списки)
#
# Пример project config (<cwd>/.gc/config.yml):
#   agent:
#     max_steps: 200                # переопределяет global для этого проекта
#     stop_tools: [browse_url]      # добавляется к global stop_tools
#   mcp:
#     servers:
#       my_local_db:                # новый MCP только для этого проекта
#         transport: stdio
#         command: psql
#
# CLI args (--max_steps 999) — самые сильные, перебивают и global, и project.
# ---------------------------------------------------------------------------

backend:
  # responses | chat_completions
  api_mode: chat_completions
  completions_url: "http://127.0.0.1:8014/v1/chat/completions"
  chat_completions_max_tokens: 32768
  # true -> отправлять max_tokens; false -> max_completion_tokens
  use_max_tokens_param: true
  # true — провайдер требует OpenAI strict tools (все properties в required).
  # false — типично для GigaCode и non-OpenAI; при true локальная валидация
  # принимает omit semantic optional (x-optional-keys).
  openai_strict_tools_schema: false
  # Vendor-specific параметры. Настраивайте под свой провайдер.
  chat_completion_kwargs:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    repetition_penalty: 1.2
    separate_reasoning: true
    chat_template_kwargs:
      enable_thinking: false
    tool_choice: auto
  # Заголовки для chat/completions (всё, что должно уйти в HTTP headers).
  # Примеры:
  # chat_completion_headers:
  #   Authorization: "Bearer sk-or-v1-..."
  #   HTTP-Referer: "https://your-app.example"
  #   X-OpenRouter-Title: "mini-cli-pub"
  #   X-Custom-Header: "value"
  #
  # env-интерполяция ${ENV:VAR}: работает в ЛЮБОМ строковом значении конфига,
  # подставляется из окружения перед валидацией. Удобно, чтобы не держать секрет
  # в файле. Отсутствующая переменная → пустая строка + warning (без значения).
  #   Authorization: "Bearer ${ENV:GC_API_KEY}"     # затем: export GC_API_KEY=sk-...
  #
  # use_ssl: bool ИЛИ строка-путь к CA-bundle (self-signed / корп-CA):
  #   true | false | "/path/ca-bundle.pem"
  use_ssl: false
  # backend mTLS (клиентский сертификат): оба ключа → mTLS; ни одного → без клиент-серта.
  # cert_path: "/path/client.crt"
  # key_path:  "/path/client.key"
  use_retry: true
  # HTTP-таймаут одного запроса к LLM (секунды). Дефолт 600 (10 минут).
  # При стриме лимит — на connect и на паузу между чанками, не на весь ответ.
  request_timeout_sec: 600

# Динамическая авторизация GigaCode (альтернатива статическому Bearer в
# backend.chat_completion_headers). Токен запрашивается у auth_endpoint и
# подставляется в Authorization при каждом вызове chat/completions.
# Раскомментируйте, если используете GigaCode API без статического токена.
# agent_auth:
#   auth_endpoint: "https://gigacode.ru/api/v2/config"
#   env_name: surface_cli
#   env_version: "0.0.1"
#   plugin_name: surf-cli-plugin
#   plugin_version: "0.0.1"
#   device_code: "mini-cli-pub - надо получить у разработчиков или взять свой в GitVerse"
#   login: login

# Вспомогательные LLM (summary, finish gate, intent scope, judges).
chat_completions:
  llm:
    max_tokens: 8192
    # Судьи (command_moderation, finish_gate / text_answer): запас под обязательный CoT/<think>.
    judge_max_tokens: 10000
    completion_kwargs:
      separate_reasoning: false
      chat_template_kwargs:
        enable_thinking: false

# TUI: что показывать во время стриминга. На подсчёт токенов и индикатор
# (спиннер, «↓ N токенов», «обдумал за Nс») НЕ влияет — только рендер контента.
# Действуют ТОЛЬКО при backend.stream: true (иначе живого вывода нет вовсе).
tui:
  # Мастер-свитч live-стриминга в TUI (chat_completions). На CLI/server/swarm НЕ
  # влияет — там всегда non-stream (стрим гейтится наличием on_stream_delta, который
  # ставит только TUI). При stream: false нет дельт → не работают счётчик
  # «↓ N токенов», строка-мысль «⠇ …», «обдумал за Nс», живой текст ответа, и
  # tui.stream_display (ниже) не имеет эффекта. Не задан → legacy backend.stream.
  stream: true
  # Что показывать во время стрима (действует только при stream: true):
  #   minimal (default) — только индикатор + счётчик токенов (без текста);
  #   answer — прогрессивный ответ, дорастающий до финала;
  #   answer_reasoning — + живая строка-мысль «⠇ …».
  stream_display: minimal
  # adaptive bounce (ТОЛЬКО TUI): как поступать с текст-ответом без вызова тула —
  # убирает дубль финального ответа и латентность «завершаю» для простых сообщений.
  #   deny  — всегда требовать tool-call (как CLI/server/swarm);
  #   judge — судья (intent_guard) решает, полный ли это ответ: простой ответ
  #           принять текстом, на комплексной задаче — bounce. Активен при
  #           backend.api_mode: chat_completions (+ strict_turn_finish_validation);
  #   allow — всегда принимать текст (ни bounce, ни судьи).
  # Default: judge. Не зависит от backend.stream.
  text_answer_mode: judge
  # Только TUI: оставить лишь корневой AGENTS.md (L3), отбросив global (~/.config/gc)
  # и .gc/AGENTS.md. Игнорируется, если задан paths.agent_md_path (путь главнее).
  agentsmd_override: false

# Diff-TUI: visual review/approve/undo правок агента в /diff (не параметры fs return_diff).
diff_tui:
  cache_max_orig: 500          # LRU лимит .orig в cache-mode
  preview_context_lines: 3     # контекст в TUI visual diff / trace-preview
  max_diff_chars: 8000         # усечение больших visual diff (0 = без лимита)

agent:
  model: MiniMax-M2.7
  system_prompt_id: v1
  use_server_subagents: false
  use_local_subagents: true
  subagent_max_steps: 50
  client_name: mini_cli_pub_agent_1
  x_cl_id: "12345"
  verbose: true
  stop_tools: [turn_ask_human]
  # Отключить целые паки или отдельные flat-скиллы из реестра (по canonical id).
  # Пакет (`pack-id`) убирает и bootstrap, и все inner. Flat-скилл (`skill-id`) — один.
  # По умолчанию пусто — все скиллы видны агенту.
  # Пример: убрать научные скиллы из роутинга:
  #   disable_skills:
  #     - science-article-creator
  disable_skills: []
  server_tool_prefix: system
  max_steps: 200
  no_tool_call_max_count: 3
  strict_turn_finish_validation: true
  # Finish gate (quality gate): макс. reject turn_finish за user turn / subagent run
  finish_gate_max_iterations: 10
  subagent_finish_gate_max_iterations: 3
  # finish_gate_use_rule_hints: false  # rule-layer без LLM — вне v1
  tool_output_inline_max_chars: 10000
  stored_tool_outputs_max_entries: 50
  inject_tool_fields:
    reason: "Brief rationale (1–2 sentences): goal, why now, expected outcome."

logging:
  full_log_backend: false
  console_trace: true
  dump_storage: true
  save_logs: true
  # Формат per-run логов:
  #   text  — человекочитаемо (дефолт, историческое поведение);
  #   jsonl — структурный поток событий {"event": ...}: agent_start,
  #           backend_request/response, dialog_message, final_answer, run_usage,
  #           summary_* и т.д. В jsonl-режиме человекочитаемый рендер в консоль
  #           подавляется — на stdout идёт чистый event-поток (удобно для парсеров).
  format: text
  # Уровень per-run логгера (актуален для jsonl): debug | info | warning | error.
  # На debug добавляются объёмные события backend_request/backend_response/agent_tools.
  log_level: info
  # Маскировка секретов (Bearer/JWT/sk-/PEM/AWS/...) перед записью в лог и stdout →
  # ***REDACTED***. По умолчанию ВЫКЛ (поведение как раньше).
  redact_secrets:
    enabled: false
    extra_keys: []       # доп. имена-подстроки чувствительных ключей (к встроенным)
    extra_patterns: []   # доп. value-regex (к встроенным)

paths:
  # Относительные пути резолвятся от каталога config.yml.
  # Промпт роли запуска (agent_md). Пусто = ролевого промпта нет.
  # В CLI/server/swarm это единственный источник инструкций; задан → замещает всё.
  agent_md_path: ""
  # chat_completions_system_prompt_path: "prompts/chat_completions_system_prompt.md"

  # threads_data_path / logs_dump_dir / skills_data_path по умолчанию НЕ заданы —
  # тогда runtime-данные пишутся в кросс-платформенные дефолтные каталоги:
  #   Linux/macOS:  ~/.local/state/gc/projects/<project-slug>/{threads,logs}/
  #   Windows:      %USERPROFILE%\.gc\projects\<project-slug>\{threads,logs}\
  # Если хочется явный путь — раскомментируй и задай абсолютный.
  # threads_data_path: ""
  # logs_dump_dir: ""

  # Обычно не задавать — gc-cli автоматически смотрит project/user/system слои.
  # Задавайте только если нужно жёстко зафиксировать единственный источник
  # (production sandbox, curated team set, CI с фикстурами).
  # skills_data_path: /opt/gc/curated-skills

  # Для пром-стенда (с одним доступным для записи каталогом, например /tmp):
  #   запускать с GC_HOME=/tmp/gc — все runtime-данные пойдут под этот корень.
  # Доступные env-переменные:
  #   GC_HOME, GC_STATE_DIR, GC_CONFIG_DIR, GC_CACHE_DIR, GC_DATA_DIR,
  #   XDG_*_HOME (стандарт freedesktop.org, только Linux/macOS).

# Лимиты trace digest для finish gate (отдельно от summary).
quality_gate:
  max_dialogue_chars: 200000
  max_message_chars: 5000

working_memory:
  max_chars_goal: 2000
  max_chars_constraints: 4000
  max_chars_state: 6000
  max_chars_knowledge: 8000
  total_budget_chars: 20000

# Technical hints о памяти (tool_usage_notice, long memory)
tool_usage_notice:
  - tool_name: session_memory
    step_messages_count: 10
    notice_message: "You have not used session memory for some steps. Review/update thread memory if needed."
project_memory:
  enable_project_memory_notice: true
  check_interval_messages: 5
  max_chars: 10000
  max_append_chars: 3000

# Intent scope: LLM post-hook после human-facing tools (только chat_completions).
# tools: [] — выключить. Параметры LLM — chat_completions.llm.
intent_scope:
  # tools.<name>.record:
  # - aggregated: хранить только текстовую сводку (без arguments/output полей)
  # - raw: хранить структурированный payload по флагам ниже
  #
  # tools.<name>.store_arguments / store_output:
  # - применяются только для record=raw
  # - если оба false -> невалидный конфиг (старт с ошибкой)
  tools:
    turn_ask_human:
      record: aggregated
    turn_finish:
      record: raw
      # turn_finish output уже содержит итоговый report/handoff/status,
      # поэтому arguments обычно дублируют данные.
      store_arguments: false
      store_output: true
  max_summary_chars: 500
  max_tool_output_chars: 8000
  max_raw_record_chars: 5000
  # Финальная проза в intent log: <= порога -> raw как есть; > порога -> LLM-саммари.
  max_final_answer_raw_chars: 2000
  read_page_record_limit: 10
  fallback_raw_on_llm_error: true

summary:
  chat_completions_summary_trigger_chars: 200000
  # Turn-end compaction после accept submit_solution (по умолчанию = 60% trigger)
  chat_completions_summary_turn_end_trigger_chars: 120000
  incremental_batch_chars: 280000
  max_message_chars: 30000
  max_dialogue_chars: 1000000
  max_accumulated_summary_chars: 60000
  last_dialog_steps_count: 4
  last_dialog_step_message_max_chars: 5000
  intent_log_preview_chars: 10000

security:
  # =========================================================================
  # 4 независимых слоя на одном уровне.
  # On/ask по дефолту (secure-by-default). Escape-hatch: mode: allow или enabled: false.
  # Подробная документация — docs/configuration.md §Security policy.
  # =========================================================================

  command_moderation:
    # Судья опасных команд/кода через LLM. Применяется к:
    #   execute_command, run_python_code
    # При нарушении возвращает envelope:
    #   { "error": { "type": "unsafe_command_blocked" }, "ok": false }
    enabled: true
    # mode:
    #   allow — судья не вызывается (всё проходит) — эквивалент enabled: false;
    #   ask   — опасное → запрос подтверждения у пользователя в stdin (дефолт);
    #   deny  — опасное → блок.
    # При недоступности judge'а: deny → fail-CLOSED; ask → запрос пользователю.
    mode: ask
    # Positive examples — ориентир безопасного профиля. Не allowlist.
    allowed_command_examples: []
    # allowed_command_examples:
    #   - "ls -la"
    #   - "git status"
    #   - "pytest tests/"
    # Negative examples — операторный deny-list. Явное совпадение (или тривиальная
    # вариация) → verdict "potentially_dangerous" + risk-флаг "operator_denied",
    # даже если команда сама по себе выглядит безобидно. Работает при mode: ask|deny.
    denied_command_examples: []
    # denied_command_examples:
    #   - "rm -rf /"
    #   - "curl * | sh"

  write_guard:
    # Write-периметр. Применяется к:
    #   write_to_file, append_to_file, search_and_replace,
    #   write-фрагментам внутри execute_command.
    # При нарушении envelope:
    #   { "error": { "type": "write_guard_violation" }, "ok": false }
    enabled: true
    # mode (как у command_moderation):
    #   deny  — write вне периметра → блок;
    #   ask   — write вне периметра → запрос подтверждения (дефолт);
    #   allow — write вне периметра → пропустить + audit `out_of_perimeter`.
    mode: ask
    # Дополнительные writable directories помимо launch_root.
    # Относительные пути резолвятся от каталога config.yml.
    extra_paths: []
    # extra_paths:
    #   - "./build"                    # относительно config.yml
    #   - "/tmp/agent-scratch"         # абсолютный
    #   - "~/Downloads/agent-out"      # ~ резолвится

  read_guard:
    # Read-периметр (симметричен write_guard). Применяется к:
    #   read_file, list_files, search_files
    # При нарушении envelope:
    #   { "error": { "type": "read_guard_violation" }, "ok": false }
    enabled: true
    # mode:
    #   deny  — read вне периметра / в denied_* → блок;
    #   ask   — то же → запрос подтверждения у пользователя (дефолт);
    #   allow — то же → пропустить + audit `out_of_perimeter`.
    mode: ask
    # -----------------------------------------------------------------
    # Разница между allowed_read_roots и allowed_read_paths (важно!):
    #
    #   allowed_read_roots = "КАРТА разрешённой территории" — большие
    #     корневые директории, где вообще разрешено читать. Это глобальный
    #     периметр. Файл вне этих корней → блок.
    #
    #   allowed_read_paths = "VIP-пропуск для исключений" — точечные дырки
    #     в denied_*. Если путь матчит — разрешено, даже если он попадает
    #     под denied_read_paths / denied_file_patterns / denied_extensions.
    #
    # Канонический пример (.gc запрещён, но .gc/skills — exception):
    #   allowed_read_roots: []                       # = [launch_root]
    #   denied_read_paths:    [<launch_root>/.gc]    # вся .gc закрыта
    #   allowed_read_paths:   [<launch_root>/.gc/skills]  # кроме skills/
    #
    # Что получится:
    #   <launch_root>/main.py             → ✅ allow (внутри проекта)
    #   /etc/passwd                       → ❌ block (вне периметра)
    #   <launch_root>/.gc/threads.json    → ❌ block (denied .gc)
    #   <launch_root>/.gc/skills/foo.md   → ✅ allow (exception override)
    # -----------------------------------------------------------------

    # Где разрешено читать (периметр):
    #   []        → трактуется как [launch_root] (только проект);
    #   ["*"]     → allow-by-default по ФС (файловая система), режут только denied_*;
    #   ["/abs"]  → объединение указанных корней.
    allowed_read_roots: []

    # Точечные exception-override НАД denied_*. Используется для подкаталогов
    # внутри denied (например skills/ внутри .gc/ — см. пример выше).
    # allowed_read_paths: []          # пусто — без exception-override
    allowed_read_paths:
      - "~/.local/share/gc/skills"   # user-layer skills
      - "<launch_root>/.gc/skills"   # project-layer skills (внутри denied .gc)
    # Запрещённые пути (плейсхолдеры: ~, %USERPROFILE%, <launch_root>):
    denied_read_paths:
      - "~/.ssh"
      - "~/.aws"
      - "~/.config/gcloud"
      - "~/.gnupg"
      - "/etc/ssl/private"
      - "/proc"
      - "/sys"
      - "~/.local/state/gc"          # state cli (треды, auth-токены)
      - "<launch_root>/.gc"          # project-local state
    # Запрещённые паттерны имени файла (fnmatch по basename):
    denied_file_patterns:
      - ".env"
      - ".env.*"
      - "*id_rsa*"
      - "*id_ed25519*"
      - "*.pem"
      - "*credentials*.json"
      - "*.sqlite"
    # Запрещённые расширения (точное совпадение):
    denied_extensions:
      - ".key"
      - ".pfx"
      - ".jks"

  url_policy:
    # Проверка URL до сетевого запроса. Применяется к:
    #   fetch_url, simple_fetch_url
    # При нарушении envelope:
    #   { "error": { "type": "url_blocked_by_policy" | "url_validation_failed" }, "ok": false }
    # Redirect targets re-validate per-hop ТОЛЬКО в simple_fetch_url.
    enabled: true
    # mode:
    #   deny  — нарушение → блок;
    #   ask   — нарушение → запрос подтверждения (дефолт);
    #   allow — нарушение → пропустить + audit `out_of_perimeter`.
    mode: ask
    # Разрешённые URI схемы (всё остальное → url_validation_failed).
    allowed_schemes: ["http", "https"]
    # Blacklist хостов / URL-паттернов.
    # Матчинг: fnmatch по host и по полному URL (case-insensitive);
    # "*.suffix" матчит любой ПОДДОМЕН (apex без поддомена не матчится).
    # Примеры правил:
    #   "host"           — точный хост;
    #   "*.suffix"       — любой поддомен suffix;
    #   "10.*"           — fnmatch wildcard;
    #   "172.1[6-9].*"   — fnmatch character class.
    # SSRF-blacklist: cloud metadata, loopback/link-local, RFC1918.
    # Расширить — .gc/config.yml (merge добавляет, не сбрасывает).
    url_blacklist:
      # --- Cloud metadata endpoints ---
      - "169.254.169.254"            # AWS / GCP / OpenStack IMDS
      - "metadata.google.internal"   # GCP metadata (apex)
      - "*.metadata.google.internal" # GCP metadata (поддомены)
      - "metadata.azure.com"         # Azure metadata (apex)
      - "*.metadata.azure.com"       # Azure metadata (поддомены)
      # --- Loopback / link-local ---
      - "localhost"
      - "127.*"                      # весь loopback-блок 127.0.0.0/8
      - "::1"                        # IPv6 loopback
      - "0.0.0.0"
      - "169.254.*"                  # link-local (включая IMDS-подсеть)
      # --- RFC1918 private networks ---
      - "10.*"                       # 10.0.0.0/8
      - "192.168.*"                  # 192.168.0.0/16
      - "172.1[6-9].*"               # 172.16-19 (часть 172.16.0.0/12)
      - "172.2[0-9].*"               # 172.20-29
      - "172.3[0-1].*"               # 172.30-31

  download:
    # Настройки builtin-тула download_file (не отдельный enforcement-слой).
    # Вкл/выкл тула — agent.stop_tools.
    download_dir: downloads         # относительный → от launch_root; абсолютный / ~/… — как есть
    max_bytes: 52428800             # 50 MiB; превышение → file_too_large, файл не создаётся
    # download_dir: /tmp/agent-scratch/downloads

  protected_paths:
    # Floor-защита системных путей (ssh-ключи, токены, конфиги — «нельзя трогать»).
    # enabled: true — активна по умолчанию; false — отключить защиту (не рекомендуется).
    # extra — дополнительные пути, которые нельзя читать/писать агенту.
    enabled: true
    extra: []
    # extra:
    #   - "/etc/secrets"
    #   - "~/.corporate/tokens"

mcp:
  servers:
    # python recommended_mcp/install.py   # ставит MCP из recommended_mcp/config.yml
    # gc-cli -a … — автозапуск HTTP-daemon'ов (science); stdio MCP спавнит агент сам
    office:
      transport: stdio
      command: office-mcp
      args: ["--transport", "stdio", "--allow-any"]
      server-name: office
      description: Read office documents (pdf, docx, xls, xlsx, pptx, csv, html, msg) as markdown
    science:
      transport: stream_http
      url: http://127.0.0.1:8765/mcp
      server-name: science
      description: Unified scientific literature search across 10 public APIs
      # HTTP-headers для MCP (для transport: http/sse и stream_http/stream_sse).
      # Удобно хранить секреты в ENV и подставлять через ${ENV:...}.
      #
      # Примечание по приоритету:
      #   - если задан token, то он превращается в `Authorization: Bearer <token>`
      #   - если задан headers.Authorization, он переопределяет Authorization из token
      #
      # Пример с token (старый/короткий способ):
      # token: "${ENV:SCIENCE_MCP_TOKEN}"
      # headers:
      #   Authorization: "Bearer ${ENV:SCIENCE_MCP_TOKEN}"
      #   X-API-Key: "${ENV:SCIENCE_MCP_X_API_KEY}"
    duckduckgo_search:
      transport: stdio
      command: ddgs-mcp
      server-name: duckduckgo
      description: Web and news search via DuckDuckGo (DDGS)
    # browser_playwright (опционально):
    #   transport: stream_stdio
    #   command: <путь npx из install.py>
    #   args: ["-y", "@playwright/mcp@0.0.70", "--output-dir", "<cache>/playwright-mcp"]
    #   persistent_session: true
    #   server-name: playwright-browser
    #   description: Browser automation via Playwright
  meta:
    tools-cache-ttl: 3600
    request_timeout_sec: 600

# Подсчёт токенов и стоимости прогона. Токены считаются всегда; цена показывается
# только при enabled: true и наличии тарифа.
# - enabled / currency / per_tokens — глобальные;
# - input/output/cache_read на верхнем уровне — ДЕФОЛТНЫЙ тариф (применяется к agent.model);
#   для одной модели имя указывать не нужно;
# - models: <имя_модели> -> { input, output, [cache_read], [currency], [per_tokens] } —
#   переопределение под конкретные модели (мультимодельные сетапы);
# - стоимость = (input−cached)·input + cached·cache_read + output·output (раздельно, складываются);
# - провайдер не вернул usage → вызов не считается (итог = нижняя граница).
pricing:
  enabled: false
  currency: "₽"
  per_tokens: 1000000          # ставки указаны за столько токенов
  # Дефолтный тариф под agent.model (имя модели указывать не нужно):
  # input: 59
  # output: 118
  # cache_read: 0.49           # опц.; нет → кэш биллится как input
  # Переопределение под конкретные модели (опционально):
  # models:
  #   "some/usd-model":
  #     currency: "$"            # override валюты
  #     per_tokens: 1000         # override единицы (тариф за 1K)
  #     input: 0.05
  #     output: 0.15
