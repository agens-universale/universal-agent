backend:
  # responses | chat_completions
  api_mode: chat_completions
  completions_url: "http://127.0.0.1:8014/v1/chat/completions"
  chat_completions_max_tokens: 32768
  # Optional auth for chat_completions backend.
  # chat_completions_auth_token: ""
  # openrouter_http_referer: ""
  # openrouter_x_title: ""
  use_ssl: false
  use_retry: true

agent:
  model: MiniMax-M2.7
  system_prompt_id: v1
  use_server_subagents: false
  use_local_subagents: true
  subagent_max_steps: 50
  client_name: mini_cli_pub_agent_1
  x_cl_id: "12345"
  verbose: true
  use_ask_human_tool: false
  stop_tools: []
  server_tool_prefix: system
  max_steps: 200
  no_tool_call_max_count: 3
  strict_submit_solution_validation: true
  console_trace: true
  dump_storage: true
  save_logs: true

paths:
  # Relative paths are resolved from config.yml directory.
  agent_md_path: "prompts/demo_cli_agent.md"
  # chat_completions_system_prompt_path: "prompts/chat_completions_system_prompt.md"
  # threads_data_path: ""
  # skills_data_path: ""
  # logs_dump_dir: ""

summary:
  chat_completions_summary_trigger_chars: 200000
  incremental_batch_chars: 280000
  max_message_chars: 30000
  max_dialogue_chars: 1000000
  max_accumulated_summary_chars: 60000
  original_user_messages_max_chars: 20000
  last_dialog_steps_count: 4
  last_dialog_step_message_max_chars: 5000

security:
  command_moderation:
    # allow: execute_command/run_python_code run without judge.
    # ask: dangerous verdict requires explicit user confirmation.
    # deny: dangerous verdict is blocked by policy.
    mode: deny
    root_box:
      # When enabled, write/edit tools can modify only launch_root
      # (the directory where gc-cli was started) and extra_write_paths.
      enabled: true
      # Additional writable directories. Relative paths are resolved from config.yml.
      extra_write_paths: []
    # Positive examples for the command judge. These are not a strict allowlist:
    # they describe the expected safe command profile for this project.
    allowed_command_examples: []
    url_policy:
      # fetch_url/simple_fetch_url validate only the original URL before request.
      allowed_schemes: ["http", "https"]
      # Exact hosts, glob hosts (*.internal.example), or URL globs can be listed here.
      url_blacklist: []

mcp:
  servers:
    search:
      transport: sse
      url: http://0.0.0.0:10090/mcp
      token: ""
      server-name: DuckDuckGo search
      description: Common web and News search
      # command: python3
      # args: ["server.py"]
      # cwd: ""
      # env: {}
  meta:
    tools-cache-ttl: 3600
    request_timeout_sec: 600
