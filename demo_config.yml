agent_url : 'http://127.0.0.1:8080/v1/responses'
# Режим backend API: responses | chat_completions
backend_api_mode: responses
# URL для chat/completions (используется только при backend_api_mode=chat_completions)
completions_url: 'http://127.0.0.1:8080/v1/chat/completions'
# Токен для chat/completions (например OpenRouter API key).
# Если задан, в запрос отправляется заголовок Authorization: Bearer <token>.
# Можно использовать алиас openrouter_api_key.
# chat_completions_auth_token: "sk-or-v1-..."
# openrouter_api_key: "sk-or-v1-..."
# Необязательные заголовки OpenRouter:
# openrouter_http_referer: "https://your-app.example"
# openrouter_x_title: "mini-cli-pub"
# Путь к системному промпту для режима chat/completions.
# Если не задан, используется ./prompts/chat_completions_system_prompt.md.
# chat_completions_system_prompt_path: "./prompts/chat_completions_system_prompt.md"
# Путь к системному промпту для локальных субагентов (chat/completions).
# Если не задан, раннер попробует ./prompts/chat_completions_subagent_system_prompt.md,
# а затем fallback на промпт родительского оркестратора.
# chat_completions_subagent_system_prompt_path: "./prompts/chat_completions_subagent_system_prompt.md"
#
# Лимит токенов на ответ API chat/completions (поле max_tokens). У OpenRouter фактический
# потолок генерации ≈ min(max_tokens, context_window − длина_промпта): длинная история треда
# «съедает» окно — аргументы тула обрываются на десятках символов даже при большом max_tokens.
# Тогда: короткий write/create + append_to_file чанками, суммаризация/новый тред, или модель с
# большим контекстом. Допустимы int и строки вида "16k", "32k".
# chat_completions_max_tokens: 8096
# Параметры суммаризации для chat/completions.
summary_params:
  # Путь к промпту суммаризации длинного диалога.
  # Если не задан, используется ./prompts/chat_completions_summary_prompt.md.
  # chat_completions_summary_prompt_path: "./prompts/chat_completions_summary_prompt.md"
  # Путь к промпту обновления journal на шаге memory update.
  # Если не задан, используется ./prompts/chat_completions_memory_update_prompt.md.
  # chat_completions_memory_update_prompt_path: "./prompts/chat_completions_memory_update_prompt.md"
  # Путь к промпту LLM-валидации финального submit_solution на консистентность user intent.
  # Если не задан, используется ./prompts/chat_completions_intent_guard_prompt.md.
  # chat_completions_intent_guard_prompt_path: "./prompts/chat_completions_intent_guard_prompt.md"
  # Порог принудительной суммаризации в символах.
  # <= 0: отключено, > 0: триггер при chars_total >= порога.
  chat_completions_summary_trigger_chars: 0
  # Размер батча инкрементальной суммаризации. Если не задан,
  # рассчитывается как int(chat_completions_summary_trigger_chars * 1.4).
  incremental_batch_chars: 0
  # Максимум символов на одно сообщение при подготовке истории к суммаризации.
  max_message_chars: 50000
  # Максимум символов на весь диалог (берется хвост целыми сообщениями).
  max_dialogue_chars: 1000000
  # Если накопленный summary становится длиннее этого лимита, выполняется
  # дополнительный шаг "summary-of-summary" для сжатия.
  max_accumulated_summary_chars: 20000
  # Лимит (в символах) для meta.user_messages_log (единый источник user-запросов).
  # Берутся последние сообщения целиком, пока не исчерпан бюджет.
  original_user_messages_max_chars: 20000
  # Сколько последних сообщений включать в <last_dialog_steps>.
  last_dialog_steps_count: 5
  # Максимум символов на одно сообщение в <last_dialog_steps>.
  last_dialog_step_message_max_chars: 1500
# Настройки memory_files — персистентных именованных регистров памяти треда.
# memory_files_max_file_chars: 50000       # Лимит символов на один файл (default 50000)
# memory_files_total_budget_chars: 150000  # Суммарный бюджет на все файлы (default 150000)
# memory_files_max_files: 20               # Максимум файлов в треде (default 20)

use_ssl: True
# Включить ретраи (до 5 попыток) с экспоненциальным backoff
# для запросов к backend и MCP-серверам.
use_retry: true
# remove agent_auth section if it's not necessary
agent_auth:
  "auth_endpoint": "http link to auth endpoint"
  "env_name": "surface_cli"
  "env_version": "0.0.1"
  "plugin_name": "surf-cli-plugin"
  "plugin_version": "0.0.1"
  "device_code": "set your unic device code (guid like) - for log tracing in prod"
  "login": "login"
model: CodeAgent
system_prompt_id: v1
use_server_subagents: true
# Локальные субагенты (работают только при backend_api_mode=chat_completions).
# В этом демо-конфиге backend_api_mode=responses, поэтому параметр не влияет,
# но оставлен как явная документация доступной опции.
use_local_subagents: false
# Лимит шагов дочернего агента.
subagent_max_steps: 50
# Модель для субагентов; null -> наследовать model родителя.
# subagent_model: null
client_name : mini_cli_pub_agent_1
x_cl_id : 12345
verbose: true
use_ask_human_tool: false
# Имена simple_tools, которые будут отключены и не попадут в tool registry.
# Пример:
# stop_tools: [execute_command, run_python_code]
stop_tools: []
server_tool_prefix: system
max_steps: 200
# Порог подряд идущих ответов backend без tool_call; при превышении завершаем работу
no_tool_call_max_count: 3
# Строгая проверка submit_solution(full_solution) на соответствие user intent.
# Проверяется только у основного агента (не у субагентов).
strict_submit_solution_validation: true
# Выводить пошаговый трейс работы агента в stdout (print).
# В CLI-режиме обычно удобно оставить true, в серверном режиме
# рекомендуется переопределять на false через agent_overrides.console_trace.
console_trace: true
# set dump_storage: false and save_logs: false - to prevent dumping log files in agent current work folder
dump_storage: true
save_logs: true
#
# Опциональный абсолютный путь к директории, в которую будут складываться
# файлы логов и дампы состояния (session_storage_*.json).
# Если параметр не задан или пустой, по умолчанию используется текущая
# рабочая директория, из которой запускается gc-cli.
# Пример:
# logs_dump_dir: "/home/user/my-project/gc-cli-runs"

mcp-servers:
  # доступные типы транспорта http, stdio, sse, stream_http, stream_sse, stream_stdio
  #
  # --- Playwright Browser MCP ---
  # Браузерная автоматизация через @playwright/mcp (Microsoft).
  # Инструменты: навигация, клики, ввод текста, скриншоты, accessibility-снапшот, выполнение JS.
  #
  # Перед использованием запустите MCP-сервер:
  #   Локально:  make start          (из корня проекта, требует Node.js 18+)
  #   В Docker:  cd dockerfiles/mcp/playwright && docker compose up -d --build
  #
  # browser:
  #   transport: stream_http
  #   url: http://localhost:8931/mcp
  #   description: Browser automation via Playwright. Use for web navigation, clicking,
  #     form filling, taking screenshots, and web scraping. Available actions - navigate
  #     to URL, click elements, type text, take screenshot, get page snapshot
  #     (accessibility tree), evaluate JavaScript.
  #   server-name: playwright-browser
  #
  rag:
    transport: http
    url: https://127.0.0.1:8091/mcp
    description: Gitverse documentation search and answer
    server-name: gitverse RAG
    # Проверка SSL-сертификата для этого MCP-сервера:
    # true  - включена (по умолчанию, если параметр не задан)
    # false - отключена (при проблемах с сертификатом или self-signed)
    verify-ssl: true
  search:
    transport: sse
    url: http://0.0.0.0:10090/mcp
    token: 
    server-name: DuckDuckGo search
    description: Common web and News search
    # Для этого сервера можно отдельно отключить проверку SSL, если нужно:
    # verify-ssl: false
  sbertrack:
    transport: stream_http
    url: https://sbertrack.example.sbrf.ru/mcp
    description: Tools for communicating with task-tracker system. Use it for receiving details or communicate about tasks on SberTrack platform.
    verify-ssl: false
    # Если сервер требует сертификаты, то можно указать к ним путь через параметры:
    client-cert: "/path/to/cert.pem"
    client-key: "/path/to/key.pem"
  # Пример stdio MCP (процесс запускается на каждый запрос списка тулов и на каждый вызов тула):
  # local-fs:
  #   transport: stdio
  #   command: npx
  #   args: [-y, "@modelcontextprotocol/server-filesystem", "/path/to/allowed/dir"]
  #   # cwd: /optional/working/dir
  #   # env: { "VAR": "value" }
  #   description: Local filesystem tools
  #   server-name: filesystem
mcp-meta:
  tools-cache-ttl: 3600 
  # Таймаут запроса к MCP (секунды), по spec до ~10 минут
  request_timeout_sec: 600
  
# Опциональный путь к файлу с пользовательскими инструкциями для агента (agent.md).
# Рекомендуется задавать как относительный путь от корня проекта (будет резолвиться в абсолютный) или как абсолютный путь.
# Пример: "./prompts/demo_cli_agent.md"
agent_md_path: "./prompts/demo_cli_agent.md"

# Опциональный путь к директории для хранения тредов (диалогов).
# По умолчанию используется ./threads относительно корня проекта.
# Если задать threads_data_path, он ДОЛЖЕН быть абсолютным путём в файловой системе.
# Пример:
# threads_data_path: "/home/user/my-project-threads"

# Опциональный путь к директории со скиллами (skills).
# По умолчанию используется ./skills относительно корня проекта.
# Если задать skills_data_path, он ДОЛЖЕН быть абсолютным путём в файловой системе.
# Пример:
# skills_data_path: "/home/user/my-project-skills/skills"
